<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 4px 2px 8px; user-select: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; margin: 4px 0;
         color: #fff8ec; background: linear-gradient(90deg, #3d2412, #5c3518); font-size: clamp(12px, 3.3vw, 15px); flex-wrap: wrap; }
  .pl { font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .pts { font-weight: 800; color: #f5b041; font-size: 1.2em; }
  .views { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr; gap: 6px; align-items: start; }
  .view { position: relative; }
  .view span { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; font-weight: 700; background: #0006; padding: 1px 7px; border-radius: 8px; }
  canvas { width: 100%; display: block; border-radius: 12px; box-shadow: 0 4px 14px #0005; touch-action: manipulation; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr 1fr; } .view.side { grid-column: 1 / 3; } }
  .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .hud div { background: #3d2412; color: #fff8ec; border-radius: 10px; padding: 5px 8px; font-size: 12px; }
  .hud b { display: block; font-size: 18px; color: #f5b041; }
  .meter { height: 8px; border-radius: 5px; background: #0005; overflow: hidden; margin-top: 3px; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71); }
  @media (max-width: 700px) { .hud { grid-template-columns: repeat(2, 1fr); } }
  .ctrl { display: flex; gap: 8px; margin-top: 8px; }
  button { flex: 1; border: 0; border-radius: 14px; padding: 16px 10px; font-size: clamp(16px, 4.6vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
           background: linear-gradient(135deg, #b5452d, #e0a458); box-shadow: 0 4px 0 #7a1f1f; touch-action: manipulation; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1f1f; }
  button.go { background: linear-gradient(135deg, #1e8449, #58d68d); box-shadow: 0 4px 0 #145a32; }
  button:disabled { opacity: .45; }
  .msg { text-align: center; color: #fff8ec; font-weight: 600; font-size: clamp(12px, 3.4vw, 15px); padding: 6px 10px; margin-top: 6px; border-radius: 10px; background: #7a4419; }
  .msg:empty { display: none; }
  .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 900; color: #fff;
         text-shadow: 0 2px 8px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar" id="bar"></div>
  <div class="views">
    <div class="view side"><canvas id="cs" width="600" height="300"></canvas><span id="ls"></span><div class="big" id="big"></div></div>
    <div class="view"><canvas id="cf" width="360" height="300"></canvas><span id="lf"></span></div>
    <div class="view"><canvas id="cr" width="360" height="300"></canvas><span id="lr"></span></div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  // ---- core/kyzkuu.py формулаларымен бірдей
  const DT = 0.05, HEAD = 15.0, DIST = 200.0, MAX_STEPS = 3000, WHIP_COST = 4.0, WHIP_TIME = 0.6, WHIP_GAP = 0.25, REGEN = 3.0, CHASE = 1.08;
  class Runner {
    constructor(st, stage, taps) {
      const kmh = stage === 0 ? st.speed : st.reverse;
      this.vmax = kmh / 3.6; this.v = st.burst / 3.6; this.k = 0.9 * Math.sqrt(st.burst / 5.0);
      this.smax = st.stamina; this.s = st.stamina; this.taps = taps; this.i = 0; this.wu = -1.0; this.last = -1.0;
    }
    step(lt) {
      const taps = this.taps;
      while (this.i < taps.length && taps[this.i] <= lt) {
        const tp = taps[this.i];
        if (tp - this.last >= WHIP_GAP && this.s >= WHIP_COST) { this.s = this.s - WHIP_COST; this.wu = tp + WHIP_TIME; this.last = tp; }
        this.i += 1;
      }
      const whipping = lt < this.wu;
      let target;
      if (whipping) target = this.vmax * 1.2; else if (this.s < 15.0) target = this.vmax * 0.65; else target = this.vmax * 0.8;
      this.v = this.v + (target - this.v) * this.k * DT;
      if (!whipping) this.s = Math.min(this.smax, this.s + REGEN * DT);
      this.whipping = whipping;
    }
  }

  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const $ = (id) => document.getElementById(id);
  const cs = $("cs").getContext("2d"), cf = $("cf").getContext("2d"), cr = $("cr").getContext("2d");
  let args = null, first = true, seen = null, mode = "idle", race = null, replay = null, pending = false;
  const L = () => args.labels || {};
  const setH = () => send("streamlit:setFrameHeight", { height: Math.ceil($("wrap").getBoundingClientRect().height + 8) });

  // ---- сурет
  const COL = { girl: { coat: "#c0392b", hat: "#ffffff", horse: "#f5f0e6", mane: "#bbb" }, jigit: { coat: "#1f4e79", hat: "#222", horse: "#5a321a", mane: "#1a0d05" } };
  const roleOf = (p) => (p === 0 ? "girl" : "jigit");

  function steppe(c, w, h, scroll, bob, horizon) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#5aa6e6"); g.addColorStop(horizon / h, "#d6ecf7"); g.addColorStop(horizon / h + .001, "#c8b762"); g.addColorStop(1, "#7f8a34");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = "#8193ab";
    c.beginPath(); c.moveTo(0, horizon + bob * .3);
    for (let x = 0; x <= w; x += 30) c.lineTo(x, horizon + bob * .3 - 26 * Math.abs(Math.sin((x + scroll * .15) / 70)) - 8);
    c.lineTo(w, horizon + 2); c.lineTo(0, horizon + 2); c.fill();
  }

  function horseSide(c, x, y, s, role, phase, dir) {
    const col = COL[role];
    c.save(); c.translate(x, y); c.scale(s * dir, s);
    // аяқтар
    c.strokeStyle = col.horse === "#f5f0e6" ? "#d8cfbd" : "#3e2210"; c.lineWidth = 5; c.lineCap = "round";
    const leg = (lx, ph) => { const a = Math.sin(phase + ph) * 0.7; c.beginPath(); c.moveTo(lx, 12); c.lineTo(lx + Math.sin(a) * 16, 12 + Math.cos(a) * 26); c.stroke(); };
    leg(-22, 0); leg(-14, 1.2); leg(18, 2.4); leg(26, 3.6);
    // дене
    c.fillStyle = col.horse; c.beginPath(); c.ellipse(0, 0, 34, 15, 0, 0, 7); c.fill();
    c.beginPath(); c.moveTo(24, -6); c.lineTo(40, -28); c.lineTo(52, -26); c.lineTo(44, -4); c.fill();
    c.beginPath(); c.ellipse(52, -28, 11, 6, -.4, 0, 7); c.fill();
    c.fillStyle = col.mane; c.beginPath(); c.moveTo(28, -8); c.lineTo(40, -32); c.lineTo(36, -14); c.fill();
    c.beginPath(); c.moveTo(-32, -4); c.quadraticCurveTo(-52, 2 + Math.sin(phase) * 6, -48, 18); c.lineWidth = 6; c.strokeStyle = col.mane; c.stroke();
    // шабандоз
    c.fillStyle = col.coat; c.beginPath(); c.moveTo(-6, -10); c.lineTo(10, -10); c.lineTo(6, -38); c.lineTo(-4, -38); c.fill();
    c.fillStyle = "#f1c27d"; c.beginPath(); c.arc(1, -45, 7, 0, 7); c.fill();
    c.fillStyle = col.hat; c.beginPath(); c.moveTo(-7, -49); c.lineTo(9, -49); c.lineTo(1, -62); c.fill();
    if (role === "girl") { c.strokeStyle = "#fff"; c.lineWidth = 2; c.beginPath(); c.moveTo(1, -62); c.quadraticCurveTo(-8, -72, -14, -66); c.stroke(); } // үкі
    else { c.strokeStyle = "#5a321a"; c.lineWidth = 2; c.beginPath(); c.moveTo(8, -30); c.lineTo(22, -46 + Math.sin(phase * 2) * 6); c.stroke(); } // қамшы
    c.restore();
  }

  function horseFront(c, x, y, s, role, phase, back) {
    const col = COL[role];
    c.save(); c.translate(x, y); c.scale(s, s);
    c.strokeStyle = col.horse === "#f5f0e6" ? "#d8cfbd" : "#3e2210"; c.lineWidth = 7; c.lineCap = "round";
    [-12, 12].forEach((lx, i) => { const a = Math.sin(phase + i * 3.1) * 10; c.beginPath(); c.moveTo(lx, 20); c.lineTo(lx, 52 - Math.max(0, a)); c.stroke(); });
    c.fillStyle = col.horse; c.beginPath(); c.ellipse(0, 10, 24, 22, 0, 0, 7); c.fill();
    if (back) { c.fillStyle = col.mane; c.beginPath(); c.moveTo(0, 18); c.quadraticCurveTo(-8 + Math.sin(phase) * 5, 40, 0, 50); c.lineWidth = 6; c.strokeStyle = col.mane; c.stroke(); }
    // шабандоз
    c.fillStyle = col.coat; c.beginPath(); c.moveTo(-13, -2); c.lineTo(13, -2); c.lineTo(9, -34); c.lineTo(-9, -34); c.fill();
    c.fillStyle = back ? "#3a2a1a" : "#f1c27d"; c.beginPath(); c.arc(0, -42, 8, 0, 7); c.fill();
    c.fillStyle = col.hat; c.beginPath(); c.moveTo(-9, -46); c.lineTo(9, -46); c.lineTo(0, -60); c.fill();
    if (role === "girl") { c.strokeStyle = "#fff"; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -60); c.lineTo(-6, -70); c.stroke(); }
    if (!back) { // аттың басы шабандоздың алдында
      c.fillStyle = col.horse; c.beginPath(); c.ellipse(0, -2, 10, 19, 0, 0, 7); c.fill();
      c.fillStyle = col.mane; c.beginPath(); c.moveTo(-6, -20); c.lineTo(0, -26); c.lineTo(6, -20); c.fill();
      c.fillStyle = "#222"; c.beginPath(); c.arc(-6, -8, 2.2, 0, 7); c.arc(6, -8, 2.2, 0, 7); c.fill();
      c.fillStyle = "#3a2a1a"; c.beginPath(); c.arc(-3, 13, 1.8, 0, 7); c.arc(3, 13, 1.8, 0, 7); c.fill();
    }
    c.restore();
  }

  function flag(c, x, y, s) {
    c.fillStyle = "#6b4423"; c.fillRect(x - 1.5 * s, y - 50 * s, 3 * s, 50 * s);
    c.fillStyle = "#f5b041"; c.beginPath(); c.moveTo(x, y - 50 * s); c.lineTo(x + 22 * s, y - 43 * s); c.lineTo(x, y - 36 * s); c.fill();
  }

  // ---- бір кадр: fx — қашушы, cx — қуушы (метр, кезең бағытымен)
  function draw(fx, cx, fv, cv, t, stage, persp) {
    const s = args.state, fl = stage === 0 ? 0 : 1, ch = 1 - fl;
    const pos = [0, 0]; pos[fl] = fx; pos[ch] = cx;
    const me = persp, opp = 1 - me;
    const myPos = pos[me], oppPos = pos[opp];
    const phase = t * 11, bob = Math.sin(t * 2 * Math.PI * 2.2) * 5 + Math.abs(Math.sin(t * 2 * Math.PI * 1.1)) * 3;
    const dir = stage === 0 ? 1 : -1;
    // 1) Бүйірден
    {
      const w = 600, h = 300, center = (fx + cx) / 2, scale = 5.2;
      steppe(cs, w, h, center * scale * dir, bob, 150);
      const sx = (m) => w / 2 + (m - center) * scale * dir;
      cs.strokeStyle = "rgba(255,255,255,.55)"; cs.lineWidth = 1; cs.font = "11px system-ui"; cs.fillStyle = "#fff";
      for (let m = 0; m <= 200; m += 25) { const x = sx(stage === 0 ? m : 200 - m); if (x > -20 && x < w + 20) { cs.beginPath(); cs.moveTo(x, 205); cs.lineTo(x, 262); cs.stroke(); cs.fillText(m + "м", x + 3, 272); } }
      flag(cs, sx(stage === 0 ? 200 : 0), 250, 1.4);
      // жол
      cs.fillStyle = "rgba(120,90,40,.35)"; cs.fillRect(0, 238, w, 26);
      const order = [[fl, fx, 228], [ch, cx, 246]];
      order.forEach(([p, m, yy]) => horseSide(cs, sx(m), yy + (p === me ? bob : Math.sin(t * 13.8 + 1) * 4), 1.15, roleOf(p), phase + p * 1.7, dir));
    }
    // 2) Алдынан (камера ойыншының алдында, артқа қарайды)
    {
      const w = 360, h = 300;
      steppe(cf, w, h, -myPos * 4, bob, 130);
      const gap = oppPos - myPos;
      if (gap < 0) { const d = -gap, sc = Math.max(.18, 1.1 / (1 + d / 12)); horseFront(cf, w / 2 + 95 + Math.sin(t) * 8, 150 + 40 * sc + bob * sc, sc * 1.7, roleOf(opp), phase + 1.7, false); }
      horseFront(cf, w / 2 - 30, 215 + bob, 1.9, roleOf(me), phase, false);
    }
    // 3) Артынан (камера ойыншының артында, алға қарайды)
    {
      const w = 360, h = 300;
      steppe(cr, w, h, myPos * 4, bob, 130);
      const gap = oppPos - myPos, toFinish = stage === 0 ? 200 - myPos : 200 - myPos;
      if (toFinish < 80) flag(cr, w / 2 + 40, 135, Math.max(.3, 1.4 / (1 + toFinish / 15)));
      if (gap > 0) { const sc = Math.max(.18, 1.1 / (1 + gap / 12)); horseFront(cr, w / 2 + 90 + Math.sin(t * .8) * 10, 140 + 40 * sc + bob * sc * .5, sc * 1.7, roleOf(opp), phase + 1.7, true); }
      horseFront(cr, w / 2 - 30, 228 + bob, 2.1, roleOf(me), phase, true);
    }
    $("ls").textContent = L().side || ""; $("lf").textContent = L().front || ""; $("lr").textContent = L().rear || "";
  }

  function hud(mySpeed, myStam, myMax, gap, left) {
    const pct = Math.max(0, Math.min(100, myStam / myMax * 100));
    $("hud").innerHTML = `<div>${L().speed}<b>${mySpeed.toFixed(1)} ${L().kmh || ''}</b></div>
      <div>${L().stamina}<b>${Math.round(myStam)}</b><div class="meter"><i style="width:${pct}%"></i></div></div>
      <div>${L().gap}<b>${gap.toFixed(1)} м</b></div><div>${L().left}<b>${Math.max(0, left).toFixed(0)} м</b></div>`;
  }

  function bar() {
    const a = args, s = a.state;
    const st = (p) => s.stats[p];
    $("bar").innerHTML = `<span class="pl">👧 ${a.names[0]} <small>${st(0).speed.toFixed(1)} ${L().kmh || ''}</small></span>
      <span class="pts">${s.points[0]} : ${s.points[1]}</span>
      <span class="pl">${a.names[1]} <small>${st(1).speed.toFixed(1)} ${L().kmh || ''}</small> 🤠</span>`;
    $("msg").textContent = a.message || "";
  }

  // ---- басқару
  function controls() {
    const c = $("ctrl");
    if (mode === "ready") {
      c.innerHTML = `<button class="go" id="go">▶ ${L().start}</button>`;
      $("go").onclick = startRace;
    } else if (mode === "race") {
      c.innerHTML = `<button id="whip">🏇 ${L().whip}</button>`;
      const w = $("whip");
      w.addEventListener("pointerdown", (e) => { e.preventDefault(); whip(); });
    } else c.innerHTML = "";
    setH();
  }
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && mode === "race") { e.preventDefault(); whip(); } });
  [$("cs"), $("cf"), $("cr")].forEach(cv => cv.addEventListener("pointerdown", () => { if (mode === "race") whip(); }));

  function startRace() {
    const s = args.state, stage = s.stage, me = args.me, fl = stage === 0 ? 0 : 1;
    const ghost = args.ghost || [];
    const myTaps = [];
    const F = new Runner(s.stats[fl], stage, me === fl ? myTaps : ghost.slice());
    const C = new Runner(s.stats[1 - fl], stage, me === fl ? ghost.slice() : myTaps);
    C.vmax = C.vmax * CHASE;
    race = { F, C, myTaps, me, fl, stage, n: 0, fx: 0.0, cx: 0.0, started: false, c0: 0.0, t0: performance.now() + 3000, done: false };
    mode = "race"; controls();
  }

  function whip() {
    const r = race;
    if (!r || r.done) return;
    const t = r.n * DT;
    if (r.me === r.fl) r.myTaps.push(t);
    else if (r.started) r.myTaps.push(t - r.c0);
  }

  function stepRace(now) {
    const r = race;
    const pre = (r.t0 - now) / 1000;
    if (pre > 0) { $("big").textContent = Math.ceil(pre); draw(0, 0, 0, 0, 0, r.stage, r.me); hud(0, (r.me === r.fl ? r.F : r.C).s, (r.me === r.fl ? r.F : r.C).smax, 0, 200); return; }
    const target = Math.floor((now - r.t0) / 1000 / DT);
    while (!r.done && r.n < target && r.n < MAX_STEPS) {
      const t = r.n * DT;
      r.F.step(t); r.fx = r.fx + r.F.v * DT;
      if (!r.started && r.fx >= HEAD) { r.started = true; r.c0 = t; }
      if (r.started) { r.C.step(t - r.c0); r.cx = r.cx + r.C.v * DT; }
      if ((r.started && r.cx >= r.fx) || r.fx >= DIST) r.done = true;
      r.n += 1;
    }
    if (r.n >= MAX_STEPS) r.done = true;
    const t = r.n * DT;
    const meR = r.me === r.fl ? r.F : r.C;
    $("big").textContent = (r.me !== r.fl && !r.started) ? (L().wait || "") : (meR.whipping ? "💨" : "");
    draw(r.fx, r.cx, r.F.v, r.C.v, t, r.stage, r.me);
    hud(meR.v * 3.6, meR.s, meR.smax, Math.abs(r.fx - r.cx), DIST - r.fx);
    if (r.done && !pending) {
      pending = true;
      $("big").textContent = (r.started && r.cx >= r.fx) ? (r.stage === 0 ? "❤" : "〰 " + (L().whipHit || "")) : "🏁";
      send("streamlit:setComponentValue", { value: { taps: r.myTaps.slice(), nonce: Date.now() + Math.random() }, dataType: "json" });
      mode = "wait"; controls();
    }
  }

  function stepReplay(now) {
    const rp = replay, fr = rp.last.frames;
    const i = Math.min(fr.length - 1, Math.floor((now - rp.t0) / 1000 / 0.05));
    const f = fr[i], t = i * 0.2;
    const persp = args.me == null ? rp.last.fleer : args.me;
    draw(f[0], f[1], f[2], f[3], t, rp.last.stage, persp);
    const meIsF = persp === rp.last.fleer;
    hud(meIsF ? f[2] : f[3], meIsF ? f[4] : f[5], args.state.stats[persp].stamina, Math.abs(f[0] - f[1]), DIST - f[0]);
    if (i >= fr.length - 1) {
      const L0 = rp.last;
      $("big").textContent = L0.caught ? (L0.stage === 0 ? "❤ " + (L().kiss || "") : "〰 " + (L().whipHit || "")) : "🏁 " + (L().escaped || "");
      if (now - rp.t0 > fr.length * 50 + 2200) { replay = null; $("big").textContent = ""; decideMode(); }
    }
  }

  function drawIdle(now) {
    const t = now / 1000, s = args.state;
    draw(0, 0, 0, 0, t * 0.15, s.over ? 1 : s.stage, args.me == null ? 0 : args.me);
    const meS = s.stats[args.me == null ? 0 : args.me];
    hud(0, meS.stamina, meS.stamina, 0, 200);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!args) return;
    if (replay) stepReplay(now);
    else if (mode === "race" && race) stepRace(now);
    else drawIdle(now);
  }

  function decideMode() {
    const s = args.state;
    if (replay) return;
    if (args.clickable && !s.over && !pending) { if (mode !== "race") { mode = "ready"; race = null; } }
    else if (mode !== "race" || !args.clickable) { mode = "idle"; }
    controls();
  }

  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const prev = args;
    args = d.args;
    if (!prev || prev.state.turn !== args.state.turn || prev.state.stage !== args.state.stage || prev.token !== args.token) {
      if (!prev || prev.state.turn !== args.state.turn || prev.state.stage !== args.state.stage) { pending = false; if (mode === "wait") mode = "idle"; }
    }
    bar();
    const last = args.state.last, key = last ? (args.room || "") + ":" + last.id : null;
    if (!first && last && key !== seen) { seen = key; replay = { last, t0: performance.now() }; mode = "idle"; race = null; }
    else seen = key;
    first = false;
    decideMode();
    setH();
  });
  window.addEventListener("resize", () => args && setH());
  requestAnimationFrame(frame);
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
