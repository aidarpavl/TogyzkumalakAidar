<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 4px 2px 8px; user-select: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; margin: 4px 0;
         color: #fff8ec; background: linear-gradient(90deg, #3d2412, #5c3518); font-size: clamp(12px, 3.3vw, 15px); flex-wrap: wrap; }
  .pl { font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .pts { font-weight: 800; color: #f5b041; font-size: 1.2em; }
  .views { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr; gap: 6px; align-items: start; }
  .view { position: relative; }
  .view span { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; font-weight: 700; background: #0006; padding: 1px 7px; border-radius: 8px; }
  canvas { width: 100%; display: block; border-radius: 12px; box-shadow: 0 4px 14px #0005; touch-action: manipulation; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr 1fr; } .view.side { grid-column: 1 / 3; } }
  .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .hud div { background: #3d2412; color: #fff8ec; border-radius: 10px; padding: 5px 8px; font-size: 12px; }
  .hud b { display: block; font-size: 18px; color: #f5b041; }
  .meter { height: 8px; border-radius: 5px; background: #0005; overflow: hidden; margin-top: 3px; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71); }
  @media (max-width: 700px) { .hud { grid-template-columns: repeat(2, 1fr); } }
  .ctrl { display: flex; gap: 8px; margin-top: 8px; }
  button { flex: 1; border: 0; border-radius: 14px; padding: 16px 10px; font-size: clamp(16px, 4.6vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
           background: linear-gradient(135deg, #b5452d, #e0a458); box-shadow: 0 4px 0 #7a1f1f; touch-action: manipulation; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1f1f; }
  button.go { background: linear-gradient(135deg, #1e8449, #58d68d); box-shadow: 0 4px 0 #145a32; }
  button:disabled { opacity: .45; }
  .msg { text-align: center; color: #fff8ec; font-weight: 600; font-size: clamp(12px, 3.4vw, 15px); padding: 6px 10px; margin-top: 6px; border-radius: 10px; background: #7a4419; }
  .msg:empty { display: none; }
  .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 900; color: #fff;
         text-shadow: 0 2px 8px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar" id="bar"></div>
  <div class="views">
    <div class="view side"><canvas id="cs" width="600" height="300"></canvas><span id="ls"></span><div class="big" id="big"></div></div>
    <div class="view"><canvas id="cf" width="360" height="300"></canvas><span id="lf"></span></div>
    <div class="view"><canvas id="cr" width="360" height="300"></canvas><span id="lr"></span></div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  // ---- core/kyzkuu.py формулаларымен бірдей
  const DT = 0.05, HEAD = 15.0, DIST = 200.0, MAX_STEPS = 3000, WHIP_COST = 4.0, WHIP_TIME = 0.6, WHIP_GAP = 0.25, REGEN = 3.0, CHASE = 1.08;
  class Runner {
    constructor(st, stage, taps) {
      const kmh = stage === 0 ? st.speed : st.reverse;
      this.vmax = kmh / 3.6; this.v = st.burst / 3.6; this.k = 0.9 * Math.sqrt(st.burst / 5.0);
      this.smax = st.stamina; this.s = st.stamina; this.taps = taps; this.i = 0; this.wu = -1.0; this.last = -1.0;
    }
    step(lt) {
      const taps = this.taps;
      while (this.i < taps.length && taps[this.i] <= lt) {
        const tp = taps[this.i];
        if (tp - this.last >= WHIP_GAP && this.s >= WHIP_COST) { this.s = this.s - WHIP_COST; this.wu = tp + WHIP_TIME; this.last = tp; }
        this.i += 1;
      }
      const whipping = lt < this.wu;
      let target;
      if (whipping) target = this.vmax * 1.2; else if (this.s < 15.0) target = this.vmax * 0.65; else target = this.vmax * 0.8;
      this.v = this.v + (target - this.v) * this.k * DT;
      if (!whipping) this.s = Math.min(this.smax, this.s + REGEN * DT);
      this.whipping = whipping;
    }
  }

  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const $ = (id) => document.getElementById(id);
  const cs = $("cs").getContext("2d"), cf = $("cf").getContext("2d"), cr = $("cr").getContext("2d");
  let args = null, first = true, seen = null, mode = "idle", race = null, replay = null, pending = false;
  const L = () => args.labels || {};
  const setH = () => send("streamlit:setFrameHeight", { height: Math.ceil($("wrap").getBoundingClientRect().height + 8) });

  // ---- сурет
  // ---- Шабандоздар мен аттар (бүйірден / алдынан / артынан)
  const COL = {
    girl: { horse: ["#fbf6ec", "#e2d8c4", "#bfb39b"], mane: "#ece6da", hoof: "#5b4a3a", blaze: null,
            robe: "#a8142a", robe2: "#6e0c1b", dress: "#fbf7ef", trim: "#e3b23c", hat: "#a8142a", fur: "#f6f1e7",
            tokym: "#1f6f8b", skin: "#f1c9a3", hair: "#1b1110" },
    jigit: { horse: ["#a0612f", "#7a4621", "#4e2b13"], mane: "#1c0f07", hoof: "#2a1a10", blaze: "#f3ece0",
             robe: "#1d4e6e", robe2: "#123449", dress: "#f2efe8", trim: "#e3b23c", hat: "#7a1b26", fur: "#3b2a1c",
             tokym: "#8e1b2c", skin: "#d8a578", hair: "#140c08" }
  };
  const roleOf = (p) => (p === 0 ? "girl" : "jigit");

  function steppe(c, w, h, scroll, bob, horizon) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#5aa6e6"); g.addColorStop(horizon / h, "#d6ecf7"); g.addColorStop(horizon / h + .001, "#c8b762"); g.addColorStop(1, "#7f8a34");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = "#8193ab";
    c.beginPath(); c.moveTo(0, horizon + bob * .3);
    for (let x = 0; x <= w; x += 30) c.lineTo(x, horizon + bob * .3 - 26 * Math.abs(Math.sin((x + scroll * .15) / 70)) - 8);
    c.lineTo(w, horizon + 2); c.lineTo(0, horizon + 2); c.fill();
  }

  function leg2(c, hx, hy, a1, a2, l1, l2, w, color, hoof) {
    const kx = hx + Math.sin(a1) * l1, ky = hy + Math.cos(a1) * l1;
    const fx = kx + Math.sin(a1 + a2) * l2, fy = ky + Math.cos(a1 + a2) * l2;
    c.strokeStyle = color; c.lineCap = "round"; c.lineJoin = "round";
    c.lineWidth = w; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.stroke();
    c.lineWidth = w * 0.6; c.beginPath(); c.moveTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = hoof; c.beginPath(); c.ellipse(fx, fy + 1, w * 0.42, w * 0.3, a1 + a2, 0, 7); c.fill();
  }

  function riderSide(c, role, g) {
    const k = COL[role], bounce = Math.sin(g * 2) * 1.2;
    c.save(); c.translate(2, -19 + bounce);
    // желбіреген етек / шапан
    c.fillStyle = role === "girl" ? k.dress : k.robe2;
    c.beginPath(); c.moveTo(-4, -4);
    c.bezierCurveTo(-14, -2, -22, 4 + Math.sin(g * 1.7) * 3, -31, 10 + Math.sin(g * 1.5) * 4);
    c.lineTo(-19, 14); c.bezierCurveTo(-11, 11, -4, 9, 3, 6); c.closePath(); c.fill();
    c.strokeStyle = "rgba(90,40,30,.35)"; c.lineWidth = 0.8; c.stroke();
    if (role === "girl") { c.strokeStyle = k.trim; c.lineWidth = 1; c.beginPath(); c.moveTo(-31, 10 + Math.sin(g * 1.5) * 4); c.lineTo(-19, 14); c.stroke(); }
    // аяқ: сан, балтыр, етік, үзеңгі
    c.strokeStyle = role === "girl" ? k.robe : k.robe; c.lineCap = "round"; c.lineWidth = 6;
    c.beginPath(); c.moveTo(0, -2); c.lineTo(9, 6); c.stroke();
    c.strokeStyle = "#1a1210"; c.lineWidth = 4.4; c.beginPath(); c.moveTo(9, 6); c.lineTo(6.5, 17); c.stroke();
    c.fillStyle = "#1a1210"; c.beginPath(); c.ellipse(8.5, 18, 4.2, 2, 0.1, 0, 7); c.fill();
    c.strokeStyle = k.trim; c.lineWidth = 0.9; c.beginPath(); c.moveTo(6, 7); c.lineTo(7, 19); c.moveTo(4.5, 19.5); c.lineTo(11, 19.5); c.stroke();
    // дене (алға еңкейген)
    c.save(); c.rotate(0.35);
    c.fillStyle = role === "girl" ? k.dress : k.robe;
    c.beginPath(); c.moveTo(-5.5, 0); c.lineTo(6, 0); c.lineTo(5, -23); c.quadraticCurveTo(0, -27.5, -5, -23.5); c.closePath(); c.fill();
    c.strokeStyle = "rgba(90,40,30,.3)"; c.lineWidth = 0.7; c.stroke();
    if (role === "girl") {
      c.fillStyle = k.robe; c.beginPath(); c.moveTo(-5, -1.5); c.lineTo(5.2, -1.5); c.lineTo(4.4, -22.5); c.lineTo(-4.4, -23); c.closePath(); c.fill();
      c.strokeStyle = k.trim; c.lineWidth = 1.1; c.beginPath(); c.moveTo(4.8, -1.5); c.lineTo(4.2, -22.5); c.moveTo(-5, -1.5); c.lineTo(5.2, -1.5); c.stroke();
      c.fillStyle = k.trim; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(3.1, -6 - i * 4.6, 0.85, 0, 7); c.fill(); }
    } else {
      c.fillStyle = k.trim; c.fillRect(-5.8, -6.5, 12, 2.6);
      c.fillStyle = "#c0392b"; c.fillRect(0, -6.5, 2.2, 2.6);
      c.strokeStyle = "rgba(255,255,255,.22)"; c.lineWidth = 1; c.beginPath(); c.moveTo(4.2, -4); c.lineTo(3.2, -22); c.stroke();
      c.fillStyle = k.dress; c.beginPath(); c.moveTo(1, -23); c.lineTo(4, -23); c.lineTo(2.5, -19); c.fill();
    }
    // тізгін ұстаған қол
    c.strokeStyle = role === "girl" ? k.dress : k.robe; c.lineWidth = 3.6;
    c.beginPath(); c.moveTo(2, -21); c.quadraticCurveTo(10, -14, 16, -12); c.stroke();
    if (role === "girl") { c.strokeStyle = k.robe; c.lineWidth = 1.2; c.beginPath(); c.moveTo(14, -13.5); c.lineTo(15.5, -11); c.stroke(); }
    c.fillStyle = k.skin; c.beginPath(); c.arc(17, -12, 1.9, 0, 7); c.fill();
    // бас
    c.fillStyle = k.skin; c.beginPath(); c.ellipse(1, -30, 4.5, 5.3, 0, 0, 7); c.fill();
    c.beginPath(); c.moveTo(5, -31.5); c.lineTo(6.8, -29.2); c.lineTo(5, -28.3); c.fill();
    c.fillStyle = "#111"; c.beginPath(); c.arc(3.1, -31, 0.7, 0, 7); c.fill();
    if (role === "girl") {
      c.strokeStyle = k.hair; c.lineWidth = 2.3;
      for (let b = 0; b < 2; b++) {
        const ey = -14 + b * 3 + Math.sin(g * 1.3 + b) * 4;
        c.beginPath(); c.moveTo(-3, -29); c.bezierCurveTo(-10, -24 + b * 2, -16, -20 + Math.sin(g * 1.6 + b) * 3, -23, ey); c.stroke();
        c.fillStyle = k.trim; c.beginPath(); c.arc(-23.5, ey + 0.5, 1.4, 0, 7); c.fill();
      }
      c.fillStyle = k.hair; c.beginPath(); c.ellipse(-0.5, -32, 4.8, 3.4, 0, Math.PI, 0); c.fill();
      c.fillStyle = k.fur; c.beginPath(); c.ellipse(0, -34.6, 5.7, 1.9, 0, 0, 7); c.fill();
      c.fillStyle = k.hat; c.beginPath(); c.moveTo(-4.6, -35.2); c.quadraticCurveTo(-4, -42.5, 0.5, -42.8); c.quadraticCurveTo(4.8, -42.3, 4.4, -35.2); c.fill();
      c.fillStyle = k.trim; c.fillRect(-0.6, -44, 1.3, 1.5);
      c.strokeStyle = "#f7f3ea"; c.lineCap = "round";
      for (let f = 0; f < 3; f++) { c.lineWidth = 1.7 - f * 0.3; c.beginPath(); c.moveTo(0, -43.5); c.quadraticCurveTo(-3 - f * 2, -50 - f, -8 - f * 3 + Math.sin(g + f) * 1.5, -47 - f * 2); c.stroke(); }
      c.fillStyle = k.trim; c.beginPath(); c.arc(-0.6, -26.8, 0.9, 0, 7); c.fill();
    } else {
      c.strokeStyle = k.hair; c.lineWidth = 0.9; c.beginPath(); c.moveTo(3.4, -28.2); c.quadraticCurveTo(5, -27.4, 6.2, -28.6); c.stroke();
      c.fillStyle = k.fur; c.beginPath(); c.ellipse(0, -34.4, 6.3, 3, 0, 0, 7); c.fill();
      c.beginPath(); c.moveTo(-5.8, -34); c.quadraticCurveTo(-9.5, -30, -8, -25.5); c.lineTo(-4.5, -30); c.fill();
      c.fillStyle = k.hat; c.beginPath(); c.moveTo(-4.6, -36); c.quadraticCurveTo(-3, -43.2, 1, -43.6); c.quadraticCurveTo(5, -43.2, 4.6, -36); c.fill();
      c.fillStyle = k.trim; c.beginPath(); c.arc(0.6, -43.6, 1.4, 0, 7); c.fill();
      const wa = Math.sin(g * 2) * 0.6;
      c.strokeStyle = k.robe; c.lineWidth = 3.4; c.beginPath(); c.moveTo(-1, -21); c.lineTo(-6, -31); c.stroke();
      c.fillStyle = k.skin; c.beginPath(); c.arc(-6.4, -32, 1.8, 0, 7); c.fill();
      c.strokeStyle = "#4a2a12"; c.lineWidth = 1.3; c.beginPath(); c.moveTo(-6.4, -32); c.lineTo(-10 + wa * 3, -42); c.stroke();
      c.lineWidth = 0.8; c.beginPath(); c.moveTo(-10 + wa * 3, -42); c.quadraticCurveTo(-18, -44 + wa * 6, -22, -36 + wa * 8); c.stroke();
    }
    c.restore(); c.restore();
  }

  function horseSide(c, x, y, s, role, phase, dir) {
    const k = COL[role], g = phase;
    c.save(); c.translate(x, y); c.scale(s * dir, s);
    // жер көлеңкесі
    c.fillStyle = "rgba(0,0,0,.18)"; c.beginPath(); c.ellipse(0, 33, 42, 4, 0, 0, 7); c.fill();
    const legs = (far) => {
      const col = far ? k.horse[2] : k.horse[1], o = far ? 0 : 0.9;
      const hp = g + o, fp = g + 2.2 + o;
      leg2(c, -27 + (far ? 3 : 0), -1, 0.1 + 0.55 * Math.sin(hp), 0.35 + 0.5 * Math.max(0, Math.sin(hp + 1.4)), 15, 17, 7.5, col, k.hoof);
      leg2(c, 24 - (far ? 3 : 0), 1, 0.05 + 0.62 * Math.sin(fp), -(0.15 + 1.0 * Math.max(0, Math.sin(fp + 1.6))), 14, 17, 6.6, col, k.hoof);
    };
    legs(true);
    // құйрық
    c.strokeStyle = k.mane; c.lineCap = "round";
    for (let i = 0; i < 5; i++) { c.lineWidth = 3.4 - i * 0.5; c.beginPath(); c.moveTo(-37, -9);
      c.bezierCurveTo(-50, -12 + Math.sin(g + i) * 3, -60, -2 + Math.sin(g * 1.3 + i) * 5, -67 - i * 2, 6 + i * 3 + Math.sin(g + i * 0.7) * 5); c.stroke(); }
    // дене
    const grd = c.createLinearGradient(0, -24, 0, 14); grd.addColorStop(0, k.horse[0]); grd.addColorStop(1, k.horse[1]);
    c.fillStyle = grd; c.beginPath();
    c.moveTo(-36, -10);
    c.bezierCurveTo(-30, -18, -12, -15, 4, -15);
    c.bezierCurveTo(14, -15, 20, -20, 24, -24);
    c.bezierCurveTo(30, -36, 36, -46, 44, -52);
    c.bezierCurveTo(48, -55, 52, -53, 54, -50);
    c.bezierCurveTo(58, -44, 63, -38, 64.5, -34);
    c.bezierCurveTo(65.5, -30, 61, -28, 57, -29);
    c.bezierCurveTo(52, -31, 48, -34, 44, -36);
    c.bezierCurveTo(40, -28, 36, -14, 34, -4);
    c.bezierCurveTo(33, 6, 26, 10, 18, 10);
    c.bezierCurveTo(6, 14, -14, 14, -24, 10);
    c.bezierCurveTo(-34, 8, -42, 2, -40, -6);
    c.closePath(); c.fill();
    c.strokeStyle = "rgba(60,40,20,.28)"; c.lineWidth = 0.9; c.stroke();
    c.strokeStyle = "rgba(0,0,0,.13)"; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(-31, -4); c.quadraticCurveTo(-24, 4, -15, 6); c.stroke();
    c.beginPath(); c.moveTo(22, -6); c.quadraticCurveTo(27, 2, 22, 8); c.stroke();
    if (k.blaze) { c.fillStyle = k.blaze; c.beginPath(); c.moveTo(55, -49); c.quadraticCurveTo(61, -40, 63.5, -33); c.lineTo(61.5, -32); c.quadraticCurveTo(58, -40, 54, -48); c.fill(); }
    c.fillStyle = k.horse[1]; c.beginPath(); c.moveTo(47, -53); c.lineTo(45, -62); c.lineTo(51, -54); c.fill();
    c.fillStyle = "#111"; c.beginPath(); c.arc(54, -45, 1.6, 0, 7); c.fill(); c.beginPath(); c.arc(62.5, -32, 1, 0, 7); c.fill();
    // жал
    c.fillStyle = k.mane; c.beginPath(); c.moveTo(47, -55);
    for (let i = 0; i <= 7; i++) { const t = i / 7; c.lineTo(46 - t * 24 - 6 - Math.sin(g + i) * 3, -55 + t * 34 + (i % 2) * 3); }
    c.lineTo(24, -22); c.bezierCurveTo(30, -34, 38, -46, 47, -55); c.fill();
    // жүген
    c.strokeStyle = "#5a1a12"; c.lineWidth = 1.6; c.beginPath(); c.moveTo(51.5, -51); c.lineTo(58.5, -31); c.moveTo(48, -41); c.lineTo(63, -36); c.stroke();
    c.fillStyle = k.trim; [[52, -48], [55, -40], [58, -33], [53, -39.5]].forEach(([a, b]) => { c.beginPath(); c.arc(a, b, 1.15, 0, 7); c.fill(); });
    legs(false);
    // тоқым мен ер
    c.fillStyle = k.tokym; c.beginPath(); c.moveTo(-12, -15); c.lineTo(16, -15); c.lineTo(14, 3); c.lineTo(-10, 3); c.closePath(); c.fill();
    c.strokeStyle = k.trim; c.lineWidth = 1.3; c.stroke();
    c.beginPath(); c.moveTo(-8, -1); for (let i = 1; i < 7; i++) c.lineTo(-8 + i * 3.4, -1 - (i % 2) * 3); c.stroke();
    c.fillStyle = "#5a2d0c"; c.beginPath(); c.moveTo(-8, -15); c.quadraticCurveTo(2, -12, 12, -16); c.lineTo(14, -22); c.quadraticCurveTo(2, -17, -10, -21); c.closePath(); c.fill();
    c.fillStyle = k.trim; c.beginPath(); c.arc(13.5, -21.5, 1.3, 0, 7); c.fill();
    riderSide(c, role, g);
    // тізгін
    c.strokeStyle = "#3a1a0a"; c.lineWidth = 0.9; c.beginPath(); c.moveTo(22, -25 + Math.sin(g * 2) * 1.2); c.quadraticCurveTo(40, -24, 58, -31); c.stroke();
    c.restore();
  }

  function riderFront(c, role, g, back) {
    const k = COL[role], bounce = Math.sin(g * 2) * 1.2;
    c.save(); c.translate(0, bounce);
    // етіктер (екі жақта)
    c.strokeStyle = role === "girl" ? k.robe : k.robe; c.lineCap = "round"; c.lineWidth = 5.5;
    c.beginPath(); c.moveTo(-9, -2); c.lineTo(-17, 6); c.moveTo(9, -2); c.lineTo(17, 6); c.stroke();
    c.strokeStyle = "#1a1210"; c.lineWidth = 4.2; c.beginPath(); c.moveTo(-17, 6); c.lineTo(-18, 17); c.moveTo(17, 6); c.lineTo(18, 17); c.stroke();
    // дене
    c.fillStyle = role === "girl" ? k.dress : k.robe;
    c.beginPath(); c.moveTo(-12, 0); c.lineTo(12, 0); c.lineTo(10, -30); c.quadraticCurveTo(0, -35, -10, -30); c.closePath(); c.fill();
    if (role === "girl") {
      c.fillStyle = k.robe; c.beginPath(); c.moveTo(-11, -1); c.lineTo(-3, -1); c.lineTo(-2.5, -29); c.lineTo(-9.5, -29.5); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(11, -1); c.lineTo(3, -1); c.lineTo(2.5, -29); c.lineTo(9.5, -29.5); c.closePath(); c.fill();
      c.strokeStyle = k.trim; c.lineWidth = 1.1; c.beginPath(); c.moveTo(-3, -1); c.lineTo(-2.5, -29); c.moveTo(3, -1); c.lineTo(2.5, -29); c.stroke();
      if (!back) { c.fillStyle = k.trim; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(-4.5, -6 - i * 6, 0.9, 0, 7); c.arc(4.5, -6 - i * 6, 0.9, 0, 7); c.fill(); } }
    } else {
      c.fillStyle = k.trim; c.fillRect(-12, -8, 24, 3);
      if (!back) { c.fillStyle = k.dress; c.beginPath(); c.moveTo(-3, -31); c.lineTo(3, -31); c.lineTo(0, -24); c.fill();
        c.strokeStyle = "rgba(255,255,255,.25)"; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -24); c.lineTo(0, -8); c.stroke(); }
      else { c.strokeStyle = "rgba(0,0,0,.18)"; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -30); c.lineTo(0, -8); c.stroke(); }
    }
    // қолдар
    c.strokeStyle = role === "girl" ? k.dress : k.robe; c.lineWidth = 4;
    c.beginPath(); c.moveTo(-10, -26); c.quadraticCurveTo(-13, -14, -5, -10); c.stroke();
    if (role === "girl" || back) { c.beginPath(); c.moveTo(10, -26); c.quadraticCurveTo(13, -14, 5, -10); c.stroke(); }
    // бас
    const face = back ? k.hair : k.skin;
    c.fillStyle = face; c.beginPath(); c.ellipse(0, -39, 6, 7, 0, 0, 7); c.fill();
    if (!back) { c.fillStyle = "#111"; c.beginPath(); c.arc(-2.2, -40, 0.8, 0, 7); c.arc(2.2, -40, 0.8, 0, 7); c.fill();
      c.strokeStyle = "#a0523d"; c.lineWidth = 0.8; c.beginPath(); c.moveTo(-1.6, -35.5); c.quadraticCurveTo(0, -34.6, 1.6, -35.5); c.stroke(); }
    if (role === "girl") {
      c.strokeStyle = k.hair; c.lineWidth = 2.6;
      [-1, 1].forEach((sd) => { c.beginPath(); c.moveTo(sd * 4.8, -38);
        c.bezierCurveTo(sd * 7, -30, sd * (7 + Math.sin(g + sd) * 1.5), -20, sd * (6 + Math.sin(g * 1.3 + sd) * 2), back ? -6 : -10); c.stroke();
        c.fillStyle = k.trim; c.beginPath(); c.arc(sd * (6 + Math.sin(g * 1.3 + sd) * 2), back ? -5 : -9, 1.5, 0, 7); c.fill(); });
      if (!back) { c.fillStyle = k.hair; c.beginPath(); c.ellipse(0, -43.5, 6.2, 3, 0, Math.PI, 0); c.fill(); }
      c.fillStyle = k.fur; c.beginPath(); c.ellipse(0, -45.5, 7.2, 2.3, 0, 0, 7); c.fill();
      c.fillStyle = k.hat; c.beginPath(); c.moveTo(-6, -46); c.quadraticCurveTo(-5, -55, 0, -55.5); c.quadraticCurveTo(5, -55, 6, -46); c.fill();
      c.fillStyle = k.trim; c.fillRect(-0.7, -57, 1.4, 1.8);
      c.strokeStyle = "#f7f3ea"; c.lineCap = "round";
      for (let f = -1; f <= 1; f++) { c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, -56.5); c.quadraticCurveTo(f * 3, -63, f * 5 + Math.sin(g + f) * 1.2, -66 + Math.abs(f) * 2); c.stroke(); }
    } else {
      c.fillStyle = k.fur; c.beginPath(); c.ellipse(0, -45, 8, 3.4, 0, 0, 7); c.fill();
      c.beginPath(); c.moveTo(-7.5, -45); c.quadraticCurveTo(-10, -40, -8.5, -34); c.lineTo(-5.5, -40); c.fill();
      c.beginPath(); c.moveTo(7.5, -45); c.quadraticCurveTo(10, -40, 8.5, -34); c.lineTo(5.5, -40); c.fill();
      c.fillStyle = k.hat; c.beginPath(); c.moveTo(-6, -46.5); c.quadraticCurveTo(-4.5, -55, 0, -55.5); c.quadraticCurveTo(4.5, -55, 6, -46.5); c.fill();
      c.fillStyle = k.trim; c.beginPath(); c.arc(0, -55.5, 1.6, 0, 7); c.fill();
      if (!back) { c.strokeStyle = k.hair; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-2.6, -36.5); c.quadraticCurveTo(0, -35.4, 2.6, -36.5); c.stroke(); }
      // қамшы
      const wa = Math.sin(g * 2) * 0.5, sd = back ? -1 : 1;
      c.strokeStyle = k.robe; c.lineWidth = 4; c.beginPath(); c.moveTo(sd * 10, -26); c.lineTo(sd * 16, -38); c.stroke();
      c.fillStyle = k.skin; c.beginPath(); c.arc(sd * 16.5, -39, 2, 0, 7); c.fill();
      c.strokeStyle = "#4a2a12"; c.lineWidth = 1.3; c.beginPath(); c.moveTo(sd * 16.5, -39); c.lineTo(sd * (20 + wa * 4), -50); c.stroke();
      c.lineWidth = 0.8; c.beginPath(); c.moveTo(sd * (20 + wa * 4), -50); c.quadraticCurveTo(sd * 30, -52 + wa * 8, sd * 33, -42 + wa * 10); c.stroke();
    }
    c.restore();
  }

  function horseFront(c, x, y, s, role, phase, back) {
    const k = COL[role], g = phase;
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = "rgba(0,0,0,.18)"; c.beginPath(); c.ellipse(0, 56, 24, 4, 0, 0, 7); c.fill();
    const legF = (lx, ph, col, w, top) => {
      const lift = Math.max(0, Math.sin(ph)) * 12;
      c.strokeStyle = col; c.lineCap = "round"; c.lineWidth = w;
      c.beginPath(); c.moveTo(lx, top); c.lineTo(lx * 1.04, 38 - lift * 0.4); c.stroke();
      c.lineWidth = w * 0.65; c.beginPath(); c.moveTo(lx * 1.04, 38 - lift * 0.4); c.lineTo(lx, 54 - lift); c.stroke();
      c.fillStyle = k.hoof; c.beginPath(); c.ellipse(lx, 55 - lift, w * 0.5, w * 0.3, 0, 0, 7); c.fill();
    };
    // артқы жұп аяқ (күңгірт)
    legF(-7, g + 1.2, k.horse[2], 5.5, 20); legF(7, g + 4.3, k.horse[2], 5.5, 20);
    if (back) {
      // құйрық
      c.strokeStyle = k.mane; c.lineCap = "round";
      for (let i = -2; i <= 2; i++) { c.lineWidth = 2.6; c.beginPath(); c.moveTo(i * 0.8, -2);
        c.bezierCurveTo(i * 2, 10, i * 3 + Math.sin(g + i) * 3, 22, i * 2.5 + Math.sin(g * 1.3 + i) * 4, 36); c.stroke(); }
      const gr = c.createRadialGradient(-6, 2, 2, 0, 8, 24); gr.addColorStop(0, k.horse[0]); gr.addColorStop(1, k.horse[1]);
      c.fillStyle = gr;
      c.beginPath(); c.ellipse(-9, 10, 12.5, 17, 0.08, 0, 7); c.fill(); c.beginPath(); c.ellipse(9, 10, 12.5, 17, -0.08, 0, 7); c.fill();
      c.strokeStyle = k.mane; for (let i = -1; i <= 1; i++) { c.lineWidth = 3; c.beginPath(); c.moveTo(i * 1.2, -4);
        c.bezierCurveTo(i * 2, 8, i * 2 + Math.sin(g + i) * 2, 16, i * 2 + Math.sin(g * 1.3 + i) * 3, 30); c.stroke(); }
      legF(-11, g + 0.6, k.horse[1], 6.5, 22); legF(11, g + 3.7, k.horse[1], 6.5, 22);
      // құлақтар шабандоздың иығынан көрінеді
      c.fillStyle = k.horse[1]; c.beginPath(); c.moveTo(-14, -28); c.lineTo(-12, -38); c.lineTo(-10, -28); c.fill();
      c.beginPath(); c.moveTo(14, -28); c.lineTo(12, -38); c.lineTo(10, -28); c.fill();
    } else {
      const gr = c.createRadialGradient(-5, 4, 2, 0, 10, 26); gr.addColorStop(0, k.horse[0]); gr.addColorStop(1, k.horse[1]);
      c.fillStyle = gr; c.beginPath(); c.ellipse(0, 12, 19, 21, 0, 0, 7); c.fill();
      c.strokeStyle = "rgba(60,40,20,.25)"; c.lineWidth = 0.8; c.stroke();
      c.strokeStyle = "rgba(0,0,0,.12)"; c.lineWidth = 1.2; c.beginPath(); c.moveTo(0, 2); c.lineTo(0, 26); c.stroke();
      legF(-10, g + 0.6, k.horse[1], 6.5, 24); legF(10, g + 3.7, k.horse[1], 6.5, 24);
    }
    // тоқым екі жағынан
    c.fillStyle = k.tokym; c.beginPath(); c.moveTo(-22, -6); c.lineTo(-15, -6); c.lineTo(-15, 13); c.lineTo(-21, 12); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(22, -6); c.lineTo(15, -6); c.lineTo(15, 13); c.lineTo(21, 12); c.closePath(); c.fill();
    c.strokeStyle = k.trim; c.lineWidth = 1; c.beginPath(); c.moveTo(-21, 12); c.lineTo(-15, 13); c.moveTo(21, 12); c.lineTo(15, 13); c.stroke();
    riderFront(c, role, g, back);
    if (!back) {
      // аттың басы шабандоздың алдында
      const hg = c.createLinearGradient(0, -30, 0, 10); hg.addColorStop(0, k.horse[0]); hg.addColorStop(1, k.horse[1]);
      c.fillStyle = k.horse[1];
      c.beginPath(); c.moveTo(-8, -24); c.lineTo(-9.5, -35); c.lineTo(-4.5, -26); c.fill();
      c.beginPath(); c.moveTo(8, -24); c.lineTo(9.5, -35); c.lineTo(4.5, -26); c.fill();
      c.fillStyle = hg; c.beginPath(); c.moveTo(-8.5, -24);
      c.bezierCurveTo(-9.5, -14, -6.5, 2, -4.8, 9); c.quadraticCurveTo(0, 12, 4.8, 9);
      c.bezierCurveTo(6.5, 2, 9.5, -14, 8.5, -24); c.quadraticCurveTo(0, -29, -8.5, -24); c.fill();
      if (k.blaze) { c.fillStyle = k.blaze; c.beginPath(); c.moveTo(-1.5, -24); c.lineTo(1.5, -24); c.lineTo(2.2, 4); c.lineTo(-2.2, 4); c.closePath(); c.fill(); }
      c.fillStyle = k.mane; c.beginPath(); c.moveTo(-5, -26); c.quadraticCurveTo(Math.sin(g) * 2, -18, 5, -26); c.quadraticCurveTo(0, -30, -5, -26); c.fill();
      c.fillStyle = "#111"; c.beginPath(); c.ellipse(-7.6, -15, 1.4, 2, 0, 0, 7); c.ellipse(7.6, -15, 1.4, 2, 0, 0, 7); c.fill();
      c.fillStyle = "#3a2a1a"; c.beginPath(); c.ellipse(-2.6, 6.5, 1.2, 1.8, 0.3, 0, 7); c.ellipse(2.6, 6.5, 1.2, 1.8, -0.3, 0, 7); c.fill();
      c.strokeStyle = "#5a1a12"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-8.6, -18); c.lineTo(8.6, -18); c.moveTo(-6, 0); c.lineTo(6, 0); c.moveTo(-8.6, -18); c.lineTo(-6, 0); c.moveTo(8.6, -18); c.lineTo(6, 0); c.stroke();
      c.fillStyle = k.trim; [-6, -2, 2, 6].forEach((xx) => { c.beginPath(); c.arc(xx, -18, 1.1, 0, 7); c.fill(); });
      c.strokeStyle = "#3a1a0a"; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-6, 0); c.quadraticCurveTo(-8, -6, -5, -10); c.moveTo(6, 0); c.quadraticCurveTo(8, -6, 5, -10); c.stroke();
    }
    c.restore();
  }

  function flag(c, x, y, s) {
    c.fillStyle = "#6b4423"; c.fillRect(x - 1.5 * s, y - 50 * s, 3 * s, 50 * s);
    c.fillStyle = "#f5b041"; c.beginPath(); c.moveTo(x, y - 50 * s); c.lineTo(x + 22 * s, y - 43 * s); c.lineTo(x, y - 36 * s); c.fill();
  }

  // ---- бір кадр: fx — қашушы, cx — қуушы (метр, кезең бағытымен)
  function draw(fx, cx, fv, cv, t, stage, persp) {
    const s = args.state, fl = stage === 0 ? 0 : 1, ch = 1 - fl;
    const pos = [0, 0]; pos[fl] = fx; pos[ch] = cx;
    const me = persp, opp = 1 - me;
    const myPos = pos[me], oppPos = pos[opp];
    const phase = t * 11, bob = Math.sin(t * 2 * Math.PI * 2.2) * 5 + Math.abs(Math.sin(t * 2 * Math.PI * 1.1)) * 3;
    const dir = stage === 0 ? 1 : -1;
    // 1) Бүйірден
    {
      const w = 600, h = 300, center = (fx + cx) / 2, scale = 5.2;
      steppe(cs, w, h, center * scale * dir, bob, 150);
      const sx = (m) => w / 2 + (m - center) * scale * dir;
      cs.strokeStyle = "rgba(255,255,255,.55)"; cs.lineWidth = 1; cs.font = "11px system-ui"; cs.fillStyle = "#fff";
      for (let m = 0; m <= 200; m += 25) { const x = sx(stage === 0 ? m : 200 - m); if (x > -20 && x < w + 20) { cs.beginPath(); cs.moveTo(x, 205); cs.lineTo(x, 262); cs.stroke(); cs.fillText(m + "м", x + 3, 272); } }
      flag(cs, sx(stage === 0 ? 200 : 0), 250, 1.4);
      // жол
      cs.fillStyle = "rgba(120,90,40,.35)"; cs.fillRect(0, 238, w, 26);
      const order = [[fl, fx, 214], [ch, cx, 238]];
      order.forEach(([p, m, yy]) => horseSide(cs, sx(m), yy + (p === me ? bob : Math.sin(t * 13.8 + 1) * 4), 1.5, roleOf(p), phase + p * 1.7, dir));
    }
    // 2) Алдынан (камера ойыншының алдында, артқа қарайды)
    {
      const w = 360, h = 300;
      steppe(cf, w, h, -myPos * 4, bob, 130);
      const gap = oppPos - myPos;
      if (gap < 0) { const d = -gap, sc = Math.max(.18, 1.1 / (1 + d / 12)); horseFront(cf, w / 2 + 95 + Math.sin(t) * 8, 150 + 40 * sc + bob * sc, sc * 1.7, roleOf(opp), phase + 1.7, false); }
      horseFront(cf, w / 2 - 30, 215 + bob, 1.9, roleOf(me), phase, false);
    }
    // 3) Артынан (камера ойыншының артында, алға қарайды)
    {
      const w = 360, h = 300;
      steppe(cr, w, h, myPos * 4, bob, 130);
      const gap = oppPos - myPos, toFinish = stage === 0 ? 200 - myPos : 200 - myPos;
      if (toFinish < 80) flag(cr, w / 2 + 40, 135, Math.max(.3, 1.4 / (1 + toFinish / 15)));
      if (gap > 0) { const sc = Math.max(.18, 1.1 / (1 + gap / 12)); horseFront(cr, w / 2 + 90 + Math.sin(t * .8) * 10, 140 + 40 * sc + bob * sc * .5, sc * 1.7, roleOf(opp), phase + 1.7, true); }
      horseFront(cr, w / 2 - 30, 228 + bob, 2.1, roleOf(me), phase, true);
    }
    $("ls").textContent = L().side || ""; $("lf").textContent = L().front || ""; $("lr").textContent = L().rear || "";
  }

  function hud(mySpeed, myStam, myMax, gap, left) {
    const pct = Math.max(0, Math.min(100, myStam / myMax * 100));
    $("hud").innerHTML = `<div>${L().speed}<b>${mySpeed.toFixed(1)} ${L().kmh || ''}</b></div>
      <div>${L().stamina}<b>${Math.round(myStam)}</b><div class="meter"><i style="width:${pct}%"></i></div></div>
      <div>${L().gap}<b>${gap.toFixed(1)} м</b></div><div>${L().left}<b>${Math.max(0, left).toFixed(0)} м</b></div>`;
  }

  function bar() {
    const a = args, s = a.state;
    const st = (p) => s.stats[p];
    $("bar").innerHTML = `<span class="pl">👧 ${a.names[0]} <small>${st(0).speed.toFixed(1)} ${L().kmh || ''}</small></span>
      <span class="pts">${s.points[0]} : ${s.points[1]}</span>
      <span class="pl">${a.names[1]} <small>${st(1).speed.toFixed(1)} ${L().kmh || ''}</small> 🤠</span>`;
    $("msg").textContent = a.message || "";
  }

  // ---- басқару
  function controls() {
    const c = $("ctrl");
    if (mode === "ready") {
      c.innerHTML = `<button class="go" id="go">▶ ${L().start}</button>`;
      $("go").onclick = startRace;
    } else if (mode === "race") {
      c.innerHTML = `<button id="whip">🏇 ${L().whip}</button>`;
      const w = $("whip");
      w.addEventListener("pointerdown", (e) => { e.preventDefault(); whip(); });
    } else c.innerHTML = "";
    setH();
  }
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && mode === "race") { e.preventDefault(); whip(); } });
  [$("cs"), $("cf"), $("cr")].forEach(cv => cv.addEventListener("pointerdown", () => { if (mode === "race") whip(); }));

  function startRace() {
    const s = args.state, stage = s.stage, me = args.me, fl = stage === 0 ? 0 : 1;
    const ghost = args.ghost || [];
    const myTaps = [];
    const F = new Runner(s.stats[fl], stage, me === fl ? myTaps : ghost.slice());
    const C = new Runner(s.stats[1 - fl], stage, me === fl ? ghost.slice() : myTaps);
    C.vmax = C.vmax * CHASE;
    race = { F, C, myTaps, me, fl, stage, n: 0, fx: 0.0, cx: 0.0, started: false, c0: 0.0, t0: performance.now() + 3000, done: false };
    mode = "race"; controls();
  }

  function whip() {
    const r = race;
    if (!r || r.done) return;
    const t = r.n * DT;
    if (r.me === r.fl) r.myTaps.push(t);
    else if (r.started) r.myTaps.push(t - r.c0);
  }

  function stepRace(now) {
    const r = race;
    const pre = (r.t0 - now) / 1000;
    if (pre > 0) { $("big").textContent = Math.ceil(pre); draw(0, 0, 0, 0, 0, r.stage, r.me); hud(0, (r.me === r.fl ? r.F : r.C).s, (r.me === r.fl ? r.F : r.C).smax, 0, 200); return; }
    const target = Math.floor((now - r.t0) / 1000 / DT);
    while (!r.done && r.n < target && r.n < MAX_STEPS) {
      const t = r.n * DT;
      r.F.step(t); r.fx = r.fx + r.F.v * DT;
      if (!r.started && r.fx >= HEAD) { r.started = true; r.c0 = t; }
      if (r.started) { r.C.step(t - r.c0); r.cx = r.cx + r.C.v * DT; }
      if ((r.started && r.cx >= r.fx) || r.fx >= DIST) r.done = true;
      r.n += 1;
    }
    if (r.n >= MAX_STEPS) r.done = true;
    const t = r.n * DT;
    const meR = r.me === r.fl ? r.F : r.C;
    $("big").textContent = (r.me !== r.fl && !r.started) ? (L().wait || "") : "";
    draw(r.fx, r.cx, r.F.v, r.C.v, t, r.stage, r.me);
    hud(meR.v * 3.6, meR.s, meR.smax, Math.abs(r.fx - r.cx), DIST - r.fx);
    if (r.done && !pending) {
      pending = true;
      $("big").textContent = (r.started && r.cx >= r.fx) ? (r.stage === 0 ? "❤" : "〰 " + (L().whipHit || "")) : "🏁";
      send("streamlit:setComponentValue", { value: { taps: r.myTaps.slice(), nonce: Date.now() + Math.random() }, dataType: "json" });
      mode = "wait"; controls();
    }
  }

  function stepReplay(now) {
    const rp = replay, fr = rp.last.frames;
    const i = Math.min(fr.length - 1, Math.floor((now - rp.t0) / 1000 / 0.05));
    const f = fr[i], t = i * 0.2;
    const persp = args.me == null ? rp.last.fleer : args.me;
    draw(f[0], f[1], f[2], f[3], t, rp.last.stage, persp);
    const meIsF = persp === rp.last.fleer;
    hud(meIsF ? f[2] : f[3], meIsF ? f[4] : f[5], args.state.stats[persp].stamina, Math.abs(f[0] - f[1]), DIST - f[0]);
    if (i >= fr.length - 1) {
      const L0 = rp.last;
      $("big").textContent = L0.caught ? (L0.stage === 0 ? "❤ " + (L().kiss || "") : "〰 " + (L().whipHit || "")) : "🏁 " + (L().escaped || "");
      if (now - rp.t0 > fr.length * 50 + 2200) { replay = null; $("big").textContent = ""; decideMode(); }
    }
  }

  function drawIdle(now) {
    const t = now / 1000, s = args.state;
    draw(0, 0, 0, 0, t * 0.15, s.over ? 1 : s.stage, args.me == null ? 0 : args.me);
    const meS = s.stats[args.me == null ? 0 : args.me];
    hud(0, meS.stamina, meS.stamina, 0, 200);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!args) return;
    if (replay) stepReplay(now);
    else if (mode === "race" && race) stepRace(now);
    else drawIdle(now);
  }

  function decideMode() {
    const s = args.state;
    if (replay) return;
    if (args.clickable && !s.over && !pending) { if (mode !== "race") { mode = "ready"; race = null; } }
    else if (mode !== "race" || !args.clickable) { mode = "idle"; }
    controls();
  }

  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const prev = args;
    args = d.args;
    if (!prev || prev.state.turn !== args.state.turn || prev.state.stage !== args.state.stage || prev.token !== args.token) {
      if (!prev || prev.state.turn !== args.state.turn || prev.state.stage !== args.state.stage) { pending = false; if (mode === "wait") mode = "idle"; }
    }
    bar();
    const last = args.state.last, key = last ? (args.room || "") + ":" + last.id : null;
    if (!first && last && key !== seen) { seen = key; replay = { last, t0: performance.now() }; mode = "idle"; race = null; }
    else seen = key;
    first = false;
    decideMode();
    setH();
  });
  window.addEventListener("resize", () => args && setH());
  requestAnimationFrame(frame);
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
