<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 4px 2px 8px; user-select: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; margin: 4px 0;
         color: #fff8ec; background: linear-gradient(90deg, #3d2412, #5c3518); font-size: clamp(12px, 3.3vw, 15px); flex-wrap: wrap; }
  .pl { font-weight: 700; } .res { font-weight: 800; color: #f5b041; font-size: 1.15em; }
  .views { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr; gap: 6px; align-items: start; }
  .view { position: relative; }
  .view span { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; font-weight: 700; background: #0006; padding: 1px 7px; border-radius: 8px; z-index: 2; }
  canvas { width: 100%; display: block; border-radius: 12px; box-shadow: 0 4px 14px #0005; }
  .view canvas.gl3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; box-shadow: none; pointer-events: none; background: transparent; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr 1fr; } .view.side { grid-column: 1 / 3; } }
  .hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .hud div { background: #3d2412; color: #fff8ec; border-radius: 10px; padding: 5px 8px; font-size: 12px; }
  .hud b { display: block; font-size: 18px; color: #f5b041; } .hud b.small { font-size: 13px; }
  .meter { height: 8px; border-radius: 5px; background: #0005; overflow: hidden; margin-top: 3px; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71); }
  @media (max-width: 700px) { .hud { grid-template-columns: repeat(3, 1fr); } }
  .ctrl { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
  #joy { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle, #5c3518 0%, #3d2412 70%); position: relative; flex: 0 0 auto;
         touch-action: none; box-shadow: inset 0 0 12px #000a; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #e0a458);
          box-shadow: 0 3px 8px #0008; pointer-events: none; }
  .btns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btns #bw { grid-column: 1 / 3; }
  button { border: 0; border-radius: 14px; padding: 16px 8px; font-size: clamp(15px, 4.2vw, 20px); font-weight: 800; color: #fff; cursor: pointer;
           background: linear-gradient(135deg, #b5452d, #e0a458); box-shadow: 0 4px 0 #7a1f1f; touch-action: manipulation; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1f1f; }
  button.go { flex: 1; background: linear-gradient(135deg, #1e8449, #58d68d); box-shadow: 0 4px 0 #145a32; }
  .msg { text-align: center; color: #fff8ec; font-weight: 600; font-size: clamp(12px, 3.4vw, 15px); padding: 6px 10px; margin-top: 6px; border-radius: 10px; background: #7a4419; }
  .msg:empty { display: none; }
  .big { position: absolute; inset: 0; display: flex; align-items: flex-start; padding-top: 40px; justify-content: center; text-align: center; font-size: 30px;
         font-weight: 900; color: #fff; text-shadow: 0 2px 8px #000; pointer-events: none; z-index: 3; }
  .keys { font-size: 11px; color: #7a4419; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar" id="bar"></div>
  <div class="views">
    <div class="view side"><canvas id="cs" width="600" height="300"></canvas><span id="ls"></span><div class="big" id="big"></div></div>
    <div class="view"><canvas id="cf" width="360" height="300"></canvas><span id="lf"></span></div>
    <div class="view"><canvas id="cr" width="360" height="300"></canvas><span id="lr"></span></div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="keys">⌨ WASD / ← ↑ → ↓ · Space — қамшы · E — іл/тарт · Q — тарт</div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  // ================= KOKPAR SIM (core/kokpar.py-мен бірдей) =================
  const K = (function () {
    const DT = 0.05, FW = 200.0, FH = 100.0, KR = 3.5, TARGET = [[193.0, 50.0], [7.0, 50.0]], R = 1.2;
    const GRAB_D = 2.2, PULL_D = 2.8, DUEL = 60, GOLDEN = 1200;
    const BASE = { k_speed: 45.0, k_accel: 6.0, k_stamina: 100.0, k_power: 1.0, k_agility: 1.0 };
    const LEVEL = { easy: [12, 0.9, 4.0], medium: [7, 0.95, 5.5], hard: [5, 0.97, 6.5], master: [5, 1.0, 7.5] };
    const pyRound4 = (x) => Math.round(x * 10000) / 10000;
    function aiStats(level) { const f = { easy: 0.94, medium: 1.0, hard: 1.02, master: 1.06 }[level] || 1.0;
      const o = {}; for (const k in BASE) o[k] = pyRound4(BASE[k] * f); return o; }
    function norm(x, y) { const d = Math.sqrt(x * x + y * y); if (d < 1e-9) return [0.0, 0.0, 0.0]; return [x / d, y / d, d]; }

    class Sim {
      constructor(hs, level, periods, periodS, aiSt) {
        this.level = level; const lv = LEVEL[level] || LEVEL.medium, mlv = LEVEL.medium;
        const stAi = aiSt || aiStats(level), stMate = Object.assign({}, BASE);
        this.riders = [];
        for (let i = 0; i < 6; i++) {
          const t = i < 3 ? 0 : 1, st = i === 0 ? hs : (t === 0 ? stMate : stAi), L = t === 0 ? mlv : lv;
          this.riders.push({ t, vmax: st.k_speed / 3.6 * (i === 0 ? 1.0 : L[1]), acc: st.k_accel / 3.6, smax: st.k_stamina,
            pow: st.k_power, agi: st.k_agility, K: L[0], tap: L[2], x: 0.0, y: 0.0, hx: 1.0, hy: 0.0, v: 0.0, s: st.k_stamina,
            whip: 0, cd: 0, stop: 0, fc: 0, dx: 0.0, dy: 0.0, slow: 0, g: 0, p: 0, w: 0 });
        }
        this.score = [0, 0]; this.periodSteps = Math.trunc(periodS / DT); this.periods = periods; this.n = 0;
        this.holder = -1; this.sx = 100.0; this.sy = 50.0; this.duel = null; this.events = []; this.over = false; this.golden = false;
        this.reset();
      }
      reset() {
        this.riders.forEach((r, i) => { const k = i % 3;
          r.x = r.t === 0 ? 70.0 : 130.0; r.y = 35.0 + 15.0 * k; r.hx = r.t === 0 ? 1.0 : -1.0; r.hy = 0.0; r.v = 0.0;
          r.whip = 0; r.cd = 10; r.stop = 0; r.dx = 0.0; r.dy = 0.0; r.slow = 0; });
        this.holder = -1; this.sx = 100.0; this.sy = 50.0; this.duel = null;
      }
      dist(a, x, y) { const dx = x - a.x, dy = y - a.y; return Math.sqrt(dx * dx + dy * dy); }
      go(r, x, y) { const [ux, uy, d] = norm(x - r.x, y - r.y); r.dx = ux; r.dy = uy; return d; }
      ai(i) {
        const r = this.riders[i], t = r.t, G = TARGET[t], D = TARGET[1 - t], h = this.holder;
        r.slow = 0;
        if (h === i) { const d = this.go(r, G[0], G[1]); if (r.s > 50.0 && d < 70.0 && r.whip === 0) r.w = 1; return; }
        const mates = []; for (let j = 0; j < 6; j++) if (this.riders[j].t === t) mates.push(j);
        if (h >= 0 && this.riders[h].t === t) {
          const hr = this.riders[h], [ux, uy] = norm(G[0] - hr.x, G[1] - hr.y), side = mates.indexOf(i) % 2 === 0 ? 1.0 : -1.0;
          this.go(r, hr.x + ux * 8.0 - uy * 6.0 * side, hr.y + uy * 8.0 + ux * 6.0 * side); return;
        }
        const byDist = (x, y) => mates.slice().sort((a, b) => { const da = this.dist(this.riders[a], x, y), db = this.dist(this.riders[b], x, y);
          return da < db ? -1 : da > db ? 1 : a - b; });
        if (h >= 0) {
          const hr = this.riders[h], order = byDist(hr.x, hr.y);
          if (order.indexOf(i) < 2) {
            const d = this.go(r, hr.x + hr.hx * hr.v * 0.4, hr.y + hr.hy * hr.v * 0.4);
            if (d < PULL_D + 0.4 && r.cd === 0) r.p = 1;
            if (d > 25.0 && r.s > 40.0 && r.whip === 0) r.w = 1;
          } else { const [ux, uy] = norm(100.0 - D[0], 50.0 - D[1]); this.go(r, D[0] + ux * 12.0, D[1] + uy * 12.0); }
          return;
        }
        const order = byDist(this.sx, this.sy);
        if (i === order[0]) { const d = this.go(r, this.sx, this.sy); if (d < 10.0) r.slow = 1; if (d < GRAB_D) r.g = 1; }
        else { const side = order.indexOf(i) === 1 ? 1.0 : -1.0, [ux, uy] = norm(G[0] - this.sx, G[1] - this.sy);
          this.go(r, this.sx + ux * 10.0 - uy * 8.0 * side, this.sy + uy * 10.0 + ux * 8.0 * side); }
      }
      step(inputs) {
        const n = this.n, hr = this.riders[0];
        hr.g = 0; hr.p = 0; hr.w = 0;
        for (const ev of inputs) { const k = ev[1];
          if (k === "d") { hr.dx = +ev[2][0]; hr.dy = +ev[2][1]; } else if (k === "w") hr.w = 1; else if (k === "g") hr.g = 1; else if (k === "p") hr.p = 1; }
        for (let i = 1; i < 6; i++) { const r = this.riders[i]; r.g = 0; r.p = 0; r.w = 0;
          if (n % r.K === i % r.K) this.ai(i);
          else if (this.holder >= 0 && this.riders[this.holder].t !== r.t) {
            const d = this.dist(r, this.riders[this.holder].x, this.riders[this.holder].y);
            if (d < PULL_D && r.cd === 0) r.p = 1; } }
        for (let i = 0; i < 6; i++) {
          const r = this.riders[i];
          if (r.w === 1 && r.whip === 0 && r.s >= 8.0 && r.stop === 0) { r.s = r.s - 8.0; r.whip = 20; }
          const vmax = r.vmax; let target;
          if (r.stop > 0) { r.stop = r.stop - 1; target = 0.0; }
          else if ((r.dx === 0.0 && r.dy === 0.0) || r.slow === 1) target = 0.25 * vmax;
          else if (r.whip > 0) target = 1.15 * vmax; else target = 0.85 * vmax;
          if (r.s < 15.0 && target > 0.6 * vmax) target = 0.6 * vmax;
          if (this.holder === i) target = target * 0.92;
          if (this.duel !== null && (this.duel[0] === i || this.duel[1] === i)) target = target * 0.6;
          if (r.v < target) r.v = Math.min(target, r.v + r.acc * DT); else r.v = Math.max(target, r.v - 2.0 * r.acc * DT);
          if (!(r.dx === 0.0 && r.dy === 0.0)) {
            const hx = r.hx + (r.dx - r.hx) * 0.15, hy = r.hy + (r.dy - r.hy) * 0.15, [ux, uy, d] = norm(hx, hy);
            if (d < 1e-6) { r.hx = r.dx; r.hy = r.dy; } else { r.hx = ux; r.hy = uy; } }
          r.x = r.x + r.hx * r.v * DT; r.y = r.y + r.hy * r.v * DT;
          if (r.x < 1.0 || r.x > FW - 1.0 || r.y < 1.0 || r.y > FH - 1.0) {
            r.x = Math.min(FW - 1.0, Math.max(1.0, r.x)); r.y = Math.min(FH - 1.0, Math.max(1.0, r.y)); r.v = r.v * 0.5; }
          if (r.v > 0.7 * vmax) r.s = r.s - 1.0 * DT; else r.s = r.s + 4.0 * DT;
          r.s = Math.min(r.smax, Math.max(0.0, r.s));
          if (r.whip > 0) r.whip = r.whip - 1; if (r.cd > 0) r.cd = r.cd - 1; if (r.fc > 0) r.fc = r.fc - 1;
        }
        for (let i = 0; i < 6; i++) { const a = this.riders[i];
          for (let j = i + 1; j < 6; j++) { const b = this.riders[j];
            const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
            if (d2 >= 4.0 * R * R || d2 === 0.0) continue;
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (2.0 * R - d) / 2.0;
            a.x = a.x - nx * o; a.y = a.y - ny * o; b.x = b.x + nx * o; b.y = b.y + ny * o;
            if (a.t !== b.t && i === 0) {
              const rvx = a.hx * a.v - b.hx * b.v, rvy = a.hy * a.v - b.hy * b.v;
              if (rvx * rvx + rvy * rvy > 324.0) { const f = a;
                if (f.fc === 0 && a.v >= b.v) { f.s = Math.max(0.0, f.s - 30.0); f.stop = 100; f.fc = 140; f.v = f.v * 0.3; this.events.push([n, "foul", 0]); } } } } }
        if (this.holder >= 0) { this.sx = this.riders[this.holder].x; this.sy = this.riders[this.holder].y; }
        else for (let i = 0; i < 6; i++) { const r = this.riders[i];
          if (r.g === 1 && r.cd === 0 && this.holder < 0 && this.dist(r, this.sx, this.sy) < GRAB_D) {
            if (r.v * 3.6 <= 20.0 * r.agi && r.s >= 10.0) { this.holder = i; this.events.push([n, "grab", i]); }
            else { r.s = Math.max(0.0, r.s - 5.0); r.cd = 20; } } }
        if (this.duel === null && this.holder >= 0) { const hrd = this.riders[this.holder];
          for (let i = 0; i < 6; i++) { const r = this.riders[i];
            if (r.p === 1 && r.cd === 0 && r.t !== hrd.t && this.dist(r, hrd.x, hrd.y) < PULL_D) {
              this.duel = [this.holder, i, n + DUEL, 0, 0, n]; this.events.push([n, "duel", i]); r.p = 0; break; } } }
        if (this.duel !== null) { const du = this.duel;
          for (const side of [0, 1]) { const idx = du[side], r = this.riders[idx];
            if (idx === 0) { if (r.p === 1) du[3 + side] = du[3 + side] + 1; }
            else { const per = Math.max(1, Math.trunc(20.0 / r.tap + 0.5)); if ((n - du[5]) % per === 0) du[3 + side] = du[3 + side] + 1; } }
          if (n >= du[2]) { const a = this.riders[du[0]], b = this.riders[du[1]];
            const sa = du[3] * a.pow * (0.5 + 0.5 * a.s / a.smax), sb = du[4] * b.pow * (0.5 + 0.5 * b.s / b.smax);
            let loser; if (sb > sa) { this.holder = du[1]; loser = a; this.events.push([n, "steal", du[1]]); } else { loser = b; this.events.push([n, "keep", du[0]]); }
            loser.s = Math.max(0.0, loser.s - 20.0); loser.cd = 30; this.duel = null; } }
        if (this.holder >= 0) { const hrd = this.riders[this.holder], G = TARGET[hrd.t];
          if (this.dist(hrd, G[0], G[1]) < KR) { this.score[hrd.t] = this.score[hrd.t] + 1; this.events.push([n, "goal", this.holder]); this.reset(); if (this.golden) this.over = true; } }
        this.n = n + 1;
        const total = this.periodSteps * this.periods;
        if (!this.golden && this.n % this.periodSteps === 0 && this.n <= total) {
          this.reset(); if (this.n === total) { if (this.score[0] === this.score[1]) this.golden = true; else this.over = true; } }
        if (this.golden && this.n >= total + GOLDEN) this.over = true;
      }
    }
    return { Sim, DT, TARGET, KR, GRAB_D, PULL_D, GOLDEN, BASE, aiStats };
  })();
  // ================= KOKPAR SIM соңы =================
  // ================= KOKPAR UI =================
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const $ = (id) => document.getElementById(id);
  const cs = $("cs").getContext("2d"), cf = $("cf").getContext("2d"), cr = $("cr").getContext("2d");
  const L = () => (args && args.labels) || {};
  const setH = () => send("streamlit:setFrameHeight", { height: Math.ceil($("wrap").getBoundingClientRect().height + 8) });
  let args = null, mode = "idle", run = null, pending = false, seen = null, first = true, joy = { x: 0, y: 0, on: false }, keys = {};

  const COL = {
    p0: { horse: ["#a0612f", "#7a4621", "#4e2b13"], mane: "#1c0f07", hoof: "#2a1a10", blaze: "#f3ece0",
          robe: "#1d5a8e", robe2: "#123449", dress: "#f2efe8", trim: "#e3b23c", hat: "#7a1b26", fur: "#3b2a1c", tokym: "#1f6f8b", skin: "#d8a578", hair: "#140c08" },
    a1: { horse: ["#d4d4d0", "#a8a8a3", "#7a7a75"], mane: "#2f2f2f", hoof: "#2a2a2a", blaze: null,
          robe: "#1d5a8e", robe2: "#123449", dress: "#f2efe8", trim: "#e3b23c", hat: "#1b3a7a", fur: "#4a3826", tokym: "#1f6f8b", skin: "#d8a578", hair: "#140c08" },
    a2: { horse: ["#6b4a2e", "#4b311c", "#2e1c0f"], mane: "#0f0905", hoof: "#2a1a10", blaze: null,
          robe: "#1d5a8e", robe2: "#123449", dress: "#f2efe8", trim: "#e3b23c", hat: "#1b3a7a", fur: "#3b2a1c", tokym: "#1f6f8b", skin: "#d8a578", hair: "#140c08" },
    b0: { horse: ["#2e2a28", "#1d1a18", "#111"], mane: "#0b0b0b", hoof: "#222", blaze: "#efe8dc",
          robe: "#a51d2a", robe2: "#6e0c1b", dress: "#f2efe8", trim: "#e3b23c", hat: "#2a2a2a", fur: "#2f2318", tokym: "#8e1b2c", skin: "#d8a578", hair: "#140c08" },
    b1: { horse: ["#b5652e", "#8e4a1e", "#5e2e10"], mane: "#5a2a10", hoof: "#2a1a10", blaze: "#f3ece0",
          robe: "#a51d2a", robe2: "#6e0c1b", dress: "#f2efe8", trim: "#e3b23c", hat: "#2a2a2a", fur: "#4a3826", tokym: "#8e1b2c", skin: "#d8a578", hair: "#140c08" },
    b2: { horse: ["#c9b28a", "#a68c62", "#7a6442"], mane: "#3a2a1a", hoof: "#2a1a10", blaze: null,
          robe: "#a51d2a", robe2: "#6e0c1b", dress: "#f2efe8", trim: "#e3b23c", hat: "#2a2a2a", fur: "#2f2318", tokym: "#8e1b2c", skin: "#d8a578", hair: "#140c08" },
  };
  const KEYS = ["p0", "a1", "a2", "b0", "b1", "b2"];

  // ================= GL3D: шағын WebGL қозғалтқышы + ат пен шабандоздың 3D үлгілері =================
  const G3 = (function () {
    // ---- геометрия (деректер; әр WebGL контекстке жеке жүктеледі)
    function sphereD(W, H) {
      const P = [], N = [], I = [];
      for (let y = 0; y <= H; y++) { const v = y / H * Math.PI;
        for (let x = 0; x <= W; x++) { const u = x / W * Math.PI * 2;
          const px = Math.sin(v) * Math.cos(u), py = Math.cos(v), pz = Math.sin(v) * Math.sin(u);
          P.push(px, py, pz); N.push(px, py, pz); } }
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const a = y * (W + 1) + x, b = a + W + 1; I.push(a, b, a + 1, b, b + 1, a + 1); }
      return [P, N, I];
    }
    function cylD(S, r0, r1) {
      const P = [], N = [], I = [];
      for (let i = 0; i <= S; i++) { const a = i / S * Math.PI * 2, c = Math.cos(a), s = Math.sin(a), ny = (r0 - r1), l = Math.hypot(1, ny);
        P.push(c * r0, -0.5, s * r0, c * r1, 0.5, s * r1); N.push(c / l, ny / l, s / l, c / l, ny / l, s / l); }
      for (let i = 0; i < S; i++) { const a = i * 2; I.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
      const base = P.length / 3;
      P.push(0, 0.5, 0); N.push(0, 1, 0); P.push(0, -0.5, 0); N.push(0, -1, 0);
      for (let i = 0; i <= S; i++) { const a = i / S * Math.PI * 2; P.push(Math.cos(a) * r1, 0.5, Math.sin(a) * r1); N.push(0, 1, 0); P.push(Math.cos(a) * r0, -0.5, Math.sin(a) * r0); N.push(0, -1, 0); }
      for (let i = 0; i < S; i++) { const a = base + 2 + i * 2; I.push(base, a + 2, a, base + 1, a + 1, a + 3); }
      return [P, N, I];
    }
    function boxD() {
      const P = [], N = [], I = [];

  // ---- ортақ көрініс бөлшектері
  function ground3d(cx, opts) {

  function flag3d(x, z) { const { P, CYL, BOX, SPH, I4 } = G3, m = I4();

  function sky2d(ctx, w, h, hy, scroll) {

  // Бейімделгіш сапа: баяу құрылғыда ажыратымдылықты төмендетеді

      let q = PERF.q; if (avg > 40 && q > 0.5) q = Math.max(0.5, q - 0.25); else if (avg < 14 && q < 1) q = Math.min(1, q + 0.25);
      if (q !== PERF.q) { PERF.q = q; views.forEach((v) => v.setQuality(q)); } }
  }
  function view3d(ctx, view, w, h, eye, target, fov, list, scroll) {

    const hp = view.project([eye[0] + dx / l * 2000, 0, eye[2] + dz / l * 2000]);
    sky2d(ctx, w, h, hp ? Math.max(0, Math.min(h, hp[1])) : h * 0.45, scroll || 0);

  }

  // 3D камералары: әр көрініске жеке WebGL кенеп (2D кенептің үстінде)
  function setup3d() {

  // ---- басқару
  function controls() {

    else if (mode === "run") {

        <button id="bp">💪 ${L().pull || ""}</button><button id="bw">🏇 ${L().whip || ""}</button></div>`;
      const pad = $("joy"), knob = $("knob");
      const upd = (ev) => { const r = pad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let dx = (ev.clientX - cx) / (r.width / 2), dy = (ev.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy);
        if (l > 1) { dx /= l; dy /= l; } joy = { x: dx, y: dy, on: l > 0.25 }; knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`; };
      pad.addEventListener("pointerdown", (e) => { pad.setPointerCapture(e.pointerId); upd(e); });
      pad.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "touch") upd(e); });
      const end = () => { joy = { x: 0, y: 0, on: false }; knob.style.transform = ""; };

  function keyDir() {

  function start() {
    const s = args.state, me = args.me;
    const sim = new K.Sim(s.stats[me], s.level, s.periods, s.period_s, s.ai_stats);
    run = { sim, inputs: [], queue: [], lastDir: [0, 0], t0: performance.now() + 3000, done: false, phases: [0, 0, 0, 0, 0, 0], flash: "", flashT: 0, ev0: 0 };

  function stepRun(now) {
    const r = run, sim = r.sim, t = (now - r.t0) / 1000;
    if (t < 0) { $("big").textContent = Math.ceil(-t); render(sim, now / 1000, r.phases); hud(sim); return; }
    const target = Math.floor(t / K.DT), lim = sim.periodSteps * sim.periods + K.GOLDEN + 5;
    let guard = 0;
    while (!r.done && sim.n < target && guard < 12) {
      const n = sim.n, ev = [];
      // бағыт: джойстик немесе пернетақта (экран: оңға = +x, төмен = +y алаңда)
      let [dx, dy] = keyDir(); if (joy.on) { dx = joy.x; dy = joy.y; }
      let d = [0, 0]; const l = Math.hypot(dx, dy);
      if (l > 0.2) d = [Math.round(dx / l * 1000) / 1000, Math.round(dy / l * 1000) / 1000];
      const ch = Math.abs(d[0] - r.lastDir[0]) + Math.abs(d[1] - r.lastDir[1]);
      if (ch > 0.05) { ev.push([n, "d", d]); r.lastDir = d; }
      const seenK = {};
      while (r.queue.length) { const k = r.queue.shift(); if (!seenK[k]) { ev.push([n, k, null]); seenK[k] = 1; } }
      ev.forEach((e) => r.inputs.push(e));
      sim.step(ev);
      sim.riders.forEach((rr, i) => { r.phases[i] += rr.v * K.DT * 0.62; });
      if (sim.over || sim.n >= lim) r.done = true;
      guard++;
    }
    // оқиғалар (гол, тартыс)
    while (r.ev0 < sim.events.length) { const e = sim.events[r.ev0++]; const lab = { goal: L().goal, steal: L().steal, keep: L().keep, foul: L().foul, grab: L().grabbed, duel: L().duel }[e[1]];
      if (lab) { r.flash = (e[1] === "goal" ? (sim.riders[e[2]] && e[2] < 3 ? "🎉 " : "😬 ") : "") + lab; r.flashT = now; } }
    const du = sim.duel;
    if (du && (du[0] === 0 || du[1] === 0)) $("big").innerHTML = `💪 ${L().pullNow || ""}<br><small>${du[0] === 0 ? du[3] : du[4]} : ${du[0] === 0 ? du[4] : du[3]}</small>`;
    else $("big").textContent = now - r.flashT < 1600 ? r.flash : "";
    render(sim, now / 1000, r.phases); hud(sim);
    if (r.done && !pending) {
      pending = true; mode = "wait"; controls();
      $("big").textContent = "🏁 " + sim.score[0] + " : " + sim.score[1];
      send("streamlit:setComponentValue", { value: { inputs: r.inputs, nonce: Date.now() + Math.random() }, dataType: "json" });
    }
  }

  let idleSim = null;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!args) return;
    if (mode === "run" && run) { stepRun(now); return; }
    if (!idleSim) { const s = args.state, me = args.me == null ? 0 : args.me;
      idleSim = new K.Sim(s.stats[me], s.level, s.periods, s.period_s, s.ai_stats); }
    const t = now / 1000; render(idleSim, t, [t * 2, t * 2 + 1, t * 2 + 2, t * 2 + 3, t * 2 + 4, t * 2 + 5]); hud(idleSim);
  }

  function bar() {
    const a = args, s = a.state, rd = s.rides || [null, null];
    const res = (p) => rd[p] ? `${rd[p].gf} : ${rd[p].ga}` : (s.turn === p && !s.over ? "🐎 …" : "—");
    $("bar").innerHTML = s.solo
      ? `<span class="pl">🟦 ${a.names[a.me == null ? 0 : a.me]}</span><span class="res">${rd.find((x) => x) ? res(rd[0] ? 0 : 1) : "—"}</span><span class="pl">${a.ai_name || ""} 🟥</span>`
      : `<span class="pl">⚪ ${a.names[0]}</span><span class="res">${res(0)}</span><span class="res">${res(1)}</span><span class="pl">${a.names[1]} ⚫</span>`;
    $("msg").textContent = a.message || "";
  }

  function decide() {
    const s = args.state;
    if (args.clickable && !s.over && !pending) { if (mode !== "run") { mode = "ready"; run = null; } }
    else if (mode !== "run" || !args.clickable) mode = "idle";
    controls();
  }

  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const prev = args; args = d.args;
    if (!prev || prev.state.turn !== args.state.turn || (prev.state.last || {}).id !== (args.state.last || {}).id) { pending = false; if (mode === "wait") mode = "idle"; idleSim = null; }
    bar(); first = false; decide(); setH();
  });
  window.addEventListener("resize", () => args && setH());
  requestAnimationFrame(frame);
  send("streamlit:componentReady", { apiVersion: 1 });
  // ================= KOKPAR UI соңы =================

})();
</script>
</body>
</html>
