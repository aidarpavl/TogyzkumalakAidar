<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 4px 2px 8px; user-select: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; margin: 4px 0;
         color: #fff8ec; background: linear-gradient(90deg, #3d2412, #5c3518); font-size: clamp(12px, 3.3vw, 15px); flex-wrap: wrap; }
  .pl { font-weight: 700; } .res { font-weight: 800; color: #f5b041; font-size: 1.15em; }
  .views { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr; gap: 6px; align-items: start; }
  .view { position: relative; }
  .view span { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; font-weight: 700; background: #0006; padding: 1px 7px; border-radius: 8px; z-index: 2; }
  canvas { width: 100%; display: block; border-radius: 12px; box-shadow: 0 4px 14px #0005; }
  .view canvas.gl3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; box-shadow: none; pointer-events: none; background: transparent; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr 1fr; } .view.side { grid-column: 1 / 3; } }
  .hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .hud div { background: #3d2412; color: #fff8ec; border-radius: 10px; padding: 5px 8px; font-size: 12px; }
  .hud b { display: block; font-size: 18px; color: #f5b041; } .hud b.small { font-size: 13px; }
  .meter { height: 8px; border-radius: 5px; background: #0005; overflow: hidden; margin-top: 3px; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71); }
  @media (max-width: 700px) { .hud { grid-template-columns: repeat(3, 1fr); } }
  .ctrl { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
  #joy { width: 116px; height: 116px; border-radius: 50%; background: radial-gradient(circle, #5c3518 0%, #3d2412 70%); position: relative; flex: 0 0 auto;
         touch-action: none; box-shadow: inset 0 0 12px #000a; }
  #knob { position: absolute; left: 33px; top: 33px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #e0a458);
          box-shadow: 0 3px 8px #0008; pointer-events: none; }
  .btns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns .x { grid-column: 1 / 3; background: linear-gradient(135deg, #2c3e50, #5d6d7e); box-shadow: 0 4px 0 #1b2631; padding: 10px; }
  .btns .hold { background: linear-gradient(135deg, #1e8449, #58d68d); box-shadow: 0 4px 0 #145a32; }
  .hud .alert { background: #c0392b; animation: blink .4s infinite alternate; } @keyframes blink { to { background: #7b241c; } }
  .hud small { display: block; opacity: .8; }
  button { border: 0; border-radius: 14px; padding: 16px 8px; font-size: clamp(15px, 4.2vw, 20px); font-weight: 800; color: #fff; cursor: pointer;
           background: linear-gradient(135deg, #b5452d, #e0a458); box-shadow: 0 4px 0 #7a1f1f; touch-action: manipulation; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1f1f; }
  button.go { flex: 1; background: linear-gradient(135deg, #1e8449, #58d68d); box-shadow: 0 4px 0 #145a32; }
  .msg { text-align: center; color: #fff8ec; font-weight: 600; font-size: clamp(12px, 3.4vw, 15px); padding: 6px 10px; margin-top: 6px; border-radius: 10px; background: #7a4419; }
  .msg:empty { display: none; }
  .big { position: absolute; inset: 0; display: flex; align-items: flex-start; padding-top: 40px; justify-content: center; text-align: center; font-size: 30px;
         font-weight: 900; color: #fff; text-shadow: 0 2px 8px #000; pointer-events: none; z-index: 3; }
  .keys { font-size: 11px; color: #7a4419; text-align: center; margin-top: 4px; }

  .pad { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .pad .btns { grid-template-columns: 1fr 1fr 1fr; }
  .pad .btns .grip { background: linear-gradient(135deg, #8e44ad, #c39bd3); box-shadow: 0 4px 0 #5b2c6f; }
  .thr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .thr button { background: linear-gradient(135deg, #b9770e, #f5b041); box-shadow: 0 4px 0 #7e5109; font-size: 13px; padding: 9px 4px; }
  .thr button small { opacity: .7; margin-right: 3px; }
  button.off { filter: grayscale(.85) brightness(.75); opacity: .55; }
  .rel { background: linear-gradient(135deg, #c0392b, #f1948a) !important; box-shadow: 0 4px 0 #78281f !important; font-size: 20px !important; padding: 16px !important; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.04); } }
  #tbar { display: none; position: absolute; left: 8%; right: 8%; bottom: 12px; height: 22px; border-radius: 11px; background: #000a; border: 2px solid #fff8; overflow: hidden; }
  #tbar span { position: absolute; left: 8px; top: 1px; color: #fff; font: bold 12px system-ui; z-index: 3; text-shadow: 0 1px 2px #000; }
  #tbar .zone { position: absolute; top: 0; bottom: 0; background: #27ae60cc; }
  #tbar .cur { position: absolute; top: -2px; bottom: -2px; width: 5px; margin-left: -2px; background: #fff; box-shadow: 0 0 6px #fff; z-index: 2; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar" id="bar"></div>
  <div class="views">
    <div class="view side"><canvas id="cs" width="600" height="300"></canvas><span id="ls"></span><div class="big" id="big"></div><div id="tbar"></div></div>
    <div class="view"><canvas id="cf" width="360" height="300"></canvas><span id="lf"></span></div>
    <div class="view"><canvas id="cr" width="360" height="300"></canvas><span id="lr"></span></div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="keys">⌨ WASD · F — ұстау · J тарту · K итеру · L тербету · Space — тірелу · 1–6 — әдіс · Enter/T (немесе әдісті қайта басу) — лақтыру</div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  // ================= KURES SIM (core/kures.py-мен бірдей) =================
  const K = (function () {
    const DT = 0.05, MAT = 4.0, GRIP_D = 1.3, WIND = 8, OPEN = 6, GOLDEN_S = 60;
    const BASIC = ["pull", "push", "rock"];
    const BEATS = { rock: "pull", pull: "push", push: "rock" };
    const COUNTER = {}; for (const k in BEATS) COUNTER[BEATS[k]] = k;
    const THROWS = {
      surin: [10, 6.0, 0.60, 0.55, 0.6, "push"], ilip: [12, 8.0, 0.52, 0.70, 0.7, "pull"],
      burap: [12, 9.0, 0.50, 0.75, 1.2, "push"], zhambas: [14, 10.0, 0.45, 0.85, 0.6, "rock"],
      koter: [18, 14.0, 0.36, 1.05, 0.9, "pull"], arqa: [20, 16.0, 0.30, 1.20, 0.8, "rock"],
    };
    const THROW_ORDER = ["arqa", "koter", "zhambas", "burap", "ilip", "surin"];
    const WEIGHTS = { 60: [0.9, 1.15], 74: [1.0, 1.0], 90: [1.08, 0.93], 100: [1.15, 0.86] };
    const LEVEL = { easy: [8, 26, 4, 3, 0.60], medium: [6, 22, 6, 2, 0.52], hard: [4, 16, 12, 1, 0.50], master: [3, 12, 15, 0, 0.45] };
    const isThrow = (a) => Object.prototype.hasOwnProperty.call(THROWS, a);
    function mult(att, dfn) {
      const winding = dfn.wind > 0;
      if (winding && dfn.act === COUNTER[att]) return -1.0;
      let m = 1.0;
      if (dfn.hold === 1) m = att === "push" ? 1.6 : 0.45;
      if (winding && isThrow(dfn.act)) m = m * 1.3;
      return m;
    }
    class Sim {
      constructor(hs, level, boutS, aiSt, weight) {
        this.level = level; const lv = LEVEL[level] || LEVEL.medium;
        [this.react, this.every, this.notice, this.late, this.patience] = lv;
        const wv = WEIGHTS[Math.trunc(weight)] || WEIGHTS[74], wp = wv[0], ws = wv[1];
        this.p = [hs, aiSt].map((st) => ({ pow: st.w_power * wp, grip: st.w_grip, smax: st.w_stamina, bmax: st.w_balance,
          tech: st.w_technique, spd: st.w_speed * ws, x: 0.0, y: 0.0, dx: 0.0, dy: 0.0, s: st.w_stamina, b: st.w_balance,
          act: "", wind: 0, k: 0, open: 0, hold: 0, cd: 0, hit: 0, adv: 0.0, warn: 0, pts: 0, q: 0.0 }));
        this.boutSteps = Math.trunc(boutS / DT); this.limit = this.boutSteps + Math.trunc(GOLDEN_S / DT);
        this.n = 0; this.grip = false; this.gwant = 0; this.golden = false; this.clean = -1; this.winner = -2;
        this.lastAct = 0; this.closeN = -1; this.hist = []; this.seen = -1; this.events = []; this.over = false;
        this.stand();
      }
      stand() {
        this.p.forEach((r, i) => { r.x = i === 0 ? -1.6 : 1.6; r.y = 0.0; r.dx = 0.0; r.dy = 0.0; r.act = ""; r.wind = 0;
          r.open = 0; r.hold = 0; r.cd = 16; r.b = Math.min(r.bmax, r.b + 30.0); });
        this.grip = false; this.gwant = 0; this.closeN = -1; this.seen = -1; this.lastAct = this.n;
      }
      start(i, act) {
        const r = this.p[i], o = this.p[1 - i];
        if (r.wind > 0 || !this.grip) return;
        if (isThrow(act)) {
          const t = THROWS[act];
          if (r.s < t[1] || o.b >= t[2] * o.bmax) return;
          r.s = r.s - t[1]; r.wind = t[0]; this.events.push([this.n, "tstart", i, act]);
        } else { if (r.s < 5.0) return; r.s = r.s - 5.0; r.wind = WIND; }
        r.act = act; r.k = 0; r.hold = 0;
        if (i === 0) { this.lastAct = this.n; this.hist.push(BASIC.includes(act) ? act : "rock"); if (this.hist.length > 5) this.hist = this.hist.slice(-5); }
      }
      quality(r) {
        const sweet = THROWS[r.act][0] - 4; let d = r.k - sweet; if (d < 0) d = -d;
        const q = 1.0 - d / (4.0 * r.tech); return q < 0.15 ? 0.15 : q;
      }
      resolveThrow(i, q) {
        const a = this.p[i], o = this.p[1 - i], t = THROWS[a.act], name = a.act;
        a.act = ""; a.wind = 0; a.open = OPEN;
        if (o.wind > 0 && o.act === t[5]) { a.b = Math.max(0.0, a.b - 12.0); a.hit = 0; o.pts = o.pts + 1; o.adv = o.adv + 12.0;
          this.events.push([this.n, "tcounter", 1 - i, name]); return; }
        const hm = o.hold === 1 ? t[4] : 1.0;
        const pw = (1.3 * t[3] * a.pow * (0.6 + 0.4 * a.grip) * q * (0.55 + 0.45 * a.s / a.smax) * (1.6 - 1.2 * o.b / o.bmax) * hm);
        const sc = pw >= 1.0 ? 4 : pw >= 0.7 ? 3 : pw >= 0.45 ? 2 : pw >= 0.25 ? 1 : 0;
        this.events.push([this.n, "throw", i, name, sc]);
        if (sc === 0) { a.b = Math.max(0.0, a.b - 10.0); a.hit = 0; return; }
        a.adv = a.adv + pw * 10.0;
        if (sc === 4) { this.clean = i; this.winner = i; return; }
        a.pts = a.pts + sc;
        if (this.golden) { this.winner = i; return; }
        this.stand();
      }
      ai() {
        const a = this.p[1], h = this.p[0], n = this.n;
        if (!this.grip) {
          const ux = h.x - a.x, uy = h.y - a.y, d = Math.sqrt(ux * ux + uy * uy);
          if (d > 1.1) { a.dx = ux / d; a.dy = uy / d; } else { a.dx = 0.0; a.dy = 0.0; }
          if (d < GRIP_D) { if (this.closeN < 0) this.closeN = n; if (n - this.closeN >= this.react) this.gwant = 1; }
          else this.closeN = -1;
          return;
        }
        a.dx = 0.0; a.dy = 0.0;
        if (a.wind > 0 && isThrow(a.act)) { if (a.k >= THROWS[a.act][0] - 4 + this.late) this.resolveThrow(1, this.quality(a)); return; }
        if (h.wind > 0) {
          if (this.seen < 0) this.seen = n;
          if (n - this.seen === this.react && a.wind === 0 && (this.seen * 7 + 3) % 20 < this.notice) {
            const c = isThrow(h.act) ? THROWS[h.act][5] : COUNTER[h.act];
            if (a.s >= 5.0) { this.start(1, c); return; } }
        } else this.seen = -1;
        if (a.wind === 0) {
          a.hold = (a.b < 0.3 * a.bmax && a.s > 12.0) ? 1 : 0;
          if (n % this.every === 0 && a.hold === 0) {
            for (const t of THROW_ORDER) if (THROWS[t][2] <= this.patience && h.b < THROWS[t][2] * h.bmax && a.s >= THROWS[t][1] + 4.0) { this.start(1, t); return; }
            if (a.s < 5.0) return;
            const cnt = { pull: 0, push: 0, rock: 0 }; for (const x of this.hist) cnt[x] = cnt[x] + 1;
            let best = "pull"; if (cnt.push > cnt[best]) best = "push"; if (cnt.rock > cnt[best]) best = "rock";
            let act = this.hist.length >= 3 ? COUNTER[best] : BASIC[Math.floor(n / this.every) % 3];
            if (h.hold === 1) act = "push";
            this.start(1, act);
          }
        }
      }
      step(inputs) {
        const n = this.n, h = this.p[0];
        for (const ev of inputs) { const k = ev[1];
          if (k === "d") { h.dx = +ev[2][0]; h.dy = +ev[2][1]; }
          else if (k === "g") { if (!this.grip) { this.gwant = 1; this.lastAct = n; } }
          else if (k === "a") this.start(0, ev[2]);
          else if (k === "h") h.hold = (ev[2] && h.wind === 0) ? 1 : 0;
          else if (k === "t") { if (h.wind > 0 && isThrow(h.act) && this.winner === -2) this.resolveThrow(0, this.quality(h)); } }
        if (this.winner === -2 && (n % 2 === 0 || this.grip)) this.ai();
        if (this.winner === -2) this.physics(n);
        if (this.winner === -2 && n - this.lastAct > 240) this.warn(n, "passive");
        this.n = n + 1;
        if (this.winner === -2 && !this.golden && this.n >= this.boutSteps) {
          const a = this.p[0].pts, b = this.p[1].pts;
          if (a !== b) this.winner = a > b ? 0 : 1; else { this.golden = true; this.events.push([n, "golden", 0]); } }
        if (this.winner === -2 && this.golden && this.n >= this.limit) {
          const d = this.p[0].adv - this.p[1].adv; this.winner = d > 1.0 ? 0 : (d < -1.0 ? 1 : -1); }
        if (this.winner !== -2) { this.over = true; this.events.push([n, "end", this.winner]); }
      }
      warn(n, why) {
        const h = this.p[0]; h.warn = h.warn + 1; this.lastAct = n; this.events.push([n, "warn", 0, why]);
        if (h.warn >= 2) { h.warn = 0; this.p[1].pts = this.p[1].pts + 1; this.events.push([n, "pen", 1]); if (this.golden) this.winner = 1; }
      }
      physics(n) {
        for (let i = 0; i < 2; i++) { const r = this.p[i];
          if (!this.grip) {
            const sp = (1.6 + 1.2 * r.spd) * DT; r.x = r.x + r.dx * sp; r.y = r.y + r.dy * sp;
            if (r.x > MAT || r.x < -MAT || r.y > MAT || r.y < -MAT) { r.x = r.x * 0.7; r.y = r.y * 0.7;
              if (i === 0) { r.dx = 0.0; r.dy = 0.0; this.warn(n, "out"); } }
            r.s = Math.min(r.smax, r.s + 8.0 * DT); r.b = Math.min(r.bmax, r.b + 6.0 * DT);
          } else {
            if (r.hold === 1) { r.s = Math.max(0.0, r.s - 6.0 * DT); if (r.s <= 0.0) r.hold = 0; }
            else if (r.wind === 0) r.s = Math.min(r.smax, r.s + 4.0 * DT);
            if (r.hit > 40) r.b = Math.min(r.bmax, r.b + 2.0 * DT);
          }
          if (r.cd > 0) r.cd = r.cd - 1; if (r.open > 0) r.open = r.open - 1; r.hit = r.hit + 1;
        }
        if (!this.grip) {
          const dx = this.p[1].x - this.p[0].x, dy = this.p[1].y - this.p[0].y;
          if (this.gwant === 1 && dx * dx + dy * dy < GRIP_D * GRIP_D && this.p[0].cd === 0 && this.p[1].cd === 0) {
            this.grip = true; this.events.push([n, "grip", 0]);
            const mx = (this.p[0].x + this.p[1].x) / 2, my = (this.p[0].y + this.p[1].y) / 2, d = Math.sqrt(dx * dx + dy * dy);
            const ux = d > 1e-9 ? dx / d : 1.0, uy = d > 1e-9 ? dy / d : 0.0;
            this.p[0].x = mx - ux * 0.45; this.p[0].y = my - uy * 0.45; this.p[1].x = mx + ux * 0.45; this.p[1].y = my + uy * 0.45;
          }
          this.gwant = 0; return;
        }
        const res = [];
        for (let i = 0; i < 2; i++) { const r = this.p[i]; if (r.wind > 0) { r.k = r.k + 1; r.wind = r.wind - 1; if (r.wind === 0) res.push(i); } }
        for (const i of res) {
          const a = this.p[i], o = this.p[1 - i];
          if (this.winner !== -2 || !this.grip || a.act === "") continue;
          if (isThrow(a.act)) { this.resolveThrow(i, 0.3); continue; }
          let m = mult(a.act, o);
          if (m < 0) { a.b = Math.max(0.0, a.b - 6.0); a.hit = 0; o.adv = o.adv + 6.0; this.events.push([n, "counter", 1 - i]); }
          else { if (o.open > 0) m = m * 1.5;
            let dmg = 5.0 * a.pow * a.grip * m * (0.5 + 0.5 * a.s / a.smax) - 1.5 * o.tech; if (dmg < 1.0) dmg = 1.0;
            o.b = Math.max(0.0, o.b - dmg); o.hit = 0; a.adv = a.adv + dmg; this.events.push([n, a.act, i]); }
          a.act = ""; a.open = OPEN;
        }
      }
    }
    return { Sim, DT, MAT, THROWS, THROW_ORDER, BASIC, COUNTER, isThrow };
  })();
  // ================= KURES SIM соңы =================
  // ================= KURES UI =================
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const $ = (id) => document.getElementById(id);
  const cs = $("cs").getContext("2d"), cf = $("cf").getContext("2d"), cr = $("cr").getContext("2d");
  const L = () => (args && args.labels) || {};
  const setH = () => send("streamlit:setFrameHeight", { height: Math.ceil($("wrap").getBoundingClientRect().height + 8) });
  let args = null, mode = "idle", run = null, pending = false, joy = { x: 0, y: 0, on: false }, keys = {};

  const STYLE = [
    { jacket: "#1f5fa0", jacket2: "#174a7e", trim: "#f4f1ea", belt: "#d9a520", pants: "#f2efe8", boot: "#5a3a22",
      skin: "#c99066", skin2: "#b27a52", hair: "#15100c", lip: "#985846" },
    { jacket: "#b0202e", jacket2: "#861722", trim: "#f4f1ea", belt: "#f1ede4", pants: "#f2efe8", boot: "#45291a",
      skin: "#d6a37c", skin2: "#be8a64", hair: "#1b1410", lip: "#a26050", mustache: true },
  ];
  const JUDGE = { jacket: "#f3f0e8", jacket2: "#dcd8cf", trim: "#2b2b2b", belt: "#2b2b2b", pants: "#2a2a2e", boot: "#1d1410",
    skin: "#c8946c", skin2: "#ae7c56", hair: "#d9d6d0", lip: "#91574a", beard: true, cap: "#1b1b1b" };

  // ================= GL3D: шағын WebGL қозғалтқышы + ат пен шабандоздың 3D үлгілері =================
  const G3 = (function () {
    // ---- геометрия (деректер; әр WebGL контекстке жеке жүктеледі)
    function sphereD(W, H) {
      const P = [], N = [], I = [];
      for (let y = 0; y <= H; y++) { const v = y / H * Math.PI;
        for (let x = 0; x <= W; x++) { const u = x / W * Math.PI * 2;
          const px = Math.sin(v) * Math.cos(u), py = Math.cos(v), pz = Math.sin(v) * Math.sin(u);
          P.push(px, py, pz); N.push(px, py, pz); } }
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const a = y * (W + 1) + x, b = a + W + 1; I.push(a, b, a + 1, b, b + 1, a + 1); }
      return [P, N, I];
    }
    function cylD(S, r0, r1) {
      const P = [], N = [], I = [];
      for (let i = 0; i <= S; i++) { const a = i / S * Math.PI * 2, c = Math.cos(a), s = Math.sin(a), ny = (r0 - r1), l = Math.hypot(1, ny);
        P.push(c * r0, -0.5, s * r0, c * r1, 0.5, s * r1); N.push(c / l, ny / l, s / l, c / l, ny / l, s / l); }
      for (let i = 0; i < S; i++) { const a = i * 2; I.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
      const base = P.length / 3;
      P.push(0, 0.5, 0); N.push(0, 1, 0); P.push(0, -0.5, 0); N.push(0, -1, 0);

      for (let i = 0; i < 2; i++) {
        const holding = (snap.grip && !anim && !end) || hands[i];
        if (holding) { PS[i] = Object.assign({}, PS[i], { handsW: [HB.beltBack(SK[1 - i], -1), HB.beltBack(SK[1 - i], 1)] }); SK[i] = HB.skeleton(R[i], PS[i]); }
      }
      for (let i = 0; i < 2; i++) {
        HB.draw(SK[i], STYLE[i]);
        const c = HB.xf(SK[i].Mp, [0, 0, 0]); HB.shadow(m, c[0], c[2], 0.3);
      }
      // ойыншы белгісі
      const hp = HB.headPt(SK[0]); G3.P(m, G3.CONE, [hp[0], hp[1] + 0.55 + Math.sin(t * 4) * 0.05, hp[2]], [0, 0, 3.1416], [0.1, 0.2, 0.1], [0.97, 0.78, 0.2], 0.6);
      // төреші
      const up = (anim && anim.u > 0.55 && anim.sc >= 1) || end;
      const jp = HB.blend(B0, { hip: [0, 0.92, 0], pel: 0, pitch: 0.05, hp: -0.1, feet: [[0, 0.08, 0.16], [0.02, 0.08, -0.16]],
        hands: up ? [[0.1, 2.05, 0.4], [0.05, 1.0, -0.3]] : [[0.05, 1.0, 0.3], [0.05, 1.0, -0.3]] }, 1);
      HB.draw(HB.skeleton(root(-4.9, -4.9, 1, 1), jp), JUDGE);
      out.sk = SK;
    });
    return { list, sk: out.sk };
  }

  function render(snap, t, anim, end) {
    const { list, sk } = scene(snap, t, anim, end);
    const hm = HB.headPt(sk[0]), ho = HB.headPt(sk[1]), cm = HB.xf(sk[0].Mp, [0, 0, 0]), co = HB.xf(sk[1].Mp, [0, 0, 0]);
    const mx = (cm[0] + co[0]) / 2, mz = (cm[2] + co[2]) / 2;
    let ax = co[0] - cm[0], az = co[2] - cm[2]; const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
    if (V3) {
      const nx = -az, nz = ax, sd = Math.max(3.7, al * 0.9 + 2.9);
      view3d(cs, V3.s, 600, 300, [mx + nx * sd, 1.55, mz + nz * sd], [mx, 1.0, mz], 0.72, list, mx * 4);
      V3.lab.clearRect(0, 0, 600, 300);
      // алдынан: қарсыластың иығының үстінен ойыншының бетіне
      view3d(cf, V3.f, 360, 300, [co[0] + ax * 0.7 - nx * 1.5, 2.0, co[2] + az * 0.7 - nz * 1.5], [hm[0], hm[1] - 0.2, hm[2]], 0.8, list, 0);
      // артынан: ойыншының иығының үстінен қарсыласқа
      view3d(cr, V3.r, 360, 300, [cm[0] - ax * 1.3 + nx * 1.1, 2.1, cm[2] - az * 1.3 + nz * 1.1], [ho[0], ho[1] - 0.35, ho[2]], 0.8, list, 0);
    } else {
      [cs, cf, cr].forEach((c, k) => { const w = k ? 360 : 600; c.fillStyle = "#e8d9b5"; c.fillRect(0, 0, w, 300);
        const sc = 300 / 10; c.save(); c.translate(w / 2, 150); c.strokeStyle = "#9c2a2a"; c.strokeRect(-4 * sc, -4 * sc, 8 * sc, 8 * sc);
        snap.p.forEach((r, i) => { c.fillStyle = i ? "#c0392b" : "#2e86de"; c.beginPath(); c.arc(r.x * sc, r.y * sc, 10, 0, 7); c.fill(); }); c.restore(); });
    }
    $("ls").textContent = L().side || ""; $("lf").textContent = L().front || ""; $("lr").textContent = L().rear || "";
  }

  // ---- HUD
  const TNAME = (n) => L()["thr_" + n] || n;
  function hud(sim) {
    const me = sim.p[0], op = sim.p[1], left = sim.golden ? Math.max(0, (sim.limit - sim.n) * K.DT) : Math.max(0, (sim.boutSteps - sim.n) * K.DT);
    const mm = Math.floor(left / 60), ss = String(Math.floor(left % 60)).padStart(2, "0");
    const bar = (v, mx, c) => `<div class="meter"><i style="width:${Math.max(0, Math.min(100, v / mx * 100))}%;background:${c}"></i></div>`;
    let st = sim.grip ? (L().gripOn || "") : (L().approach || "");
    if (op.wind > 0 && K.isThrow(op.act)) st = `⚠ ${TNAME(op.act)}! → ${L()["a_" + K.THROWS[op.act][5]] || ""}`;
    else if (op.wind > 0) st = `⚠ ${L()["a_" + op.act] || ""} → ${L()["a_" + K.COUNTER[op.act]] || ""}`;
    $("hud").innerHTML = `<div>${L().score || ""}<b>${me.pts} : ${op.pts}</b><small>${sim.golden ? "⭐ " + (L().golden || "") : ""} ${mm}:${ss}</small></div>
      <div>${L().myBal || ""}<b>${Math.round(me.b)}</b>${bar(me.b, me.bmax, "#2e86de")}</div>
      <div>${L().opBal || ""}<b>${Math.round(op.b)}</b>${bar(op.b, op.bmax, "#c0392b")}</div>
      <div>${L().stamina || ""}<b>${Math.round(me.s)}</b>${bar(me.s, me.smax, "linear-gradient(90deg,#e74c3c,#f1c40f,#2ecc71)")}</div>
      <div class="${op.wind > 0 ? "alert" : ""}">${L().state || ""} ${me.warn ? "🟨".repeat(me.warn) : ""}<b class="small">${st}</b></div>`;
    // дәлдік жолағы
    const tb = $("tbar");
    if (me.wind > 0 && K.isThrow(me.act)) {
      const W = K.THROWS[me.act][0], sweet = W - 4, z0 = Math.max(0, sweet - me.tech), z1 = Math.min(W, sweet + me.tech);
      tb.style.display = "block";
      tb.innerHTML = `<span>${TNAME(me.act)}</span><i class="zone" style="left:${z0 / W * 100}%;width:${(z1 - z0) / W * 100}%"></i><i class="cur" style="left:${me.k / W * 100}%"></i>`;
    } else tb.style.display = "none";
    // әдіс батырмаларын жаңарту
    if (mode === "run") {
      const busy = me.wind > 0 && K.isThrow(me.act);
      $("tr").style.display = busy ? "none" : ""; $("rel").style.display = busy ? "" : "none";
      K.THROW_ORDER.forEach((n) => { const b = $("t_" + n); if (!b) return;
        const ok = sim.grip && me.wind === 0 && op.b < K.THROWS[n][2] * op.bmax && me.s >= K.THROWS[n][1];
        b.classList.toggle("off", !ok); });
      $("b_g").classList.toggle("off", sim.grip);
    }
  }

  // ---- басқару
  const TKEYS = ["surin", "ilip", "burap", "zhambas", "koter", "arqa"];
  function controls() {
    const c = $("ctrl");
    if (mode === "ready") { c.innerHTML = `<button class="go" id="go">▶ ${L().start || "Start"}</button>`; $("go").onclick = start; }
    else if (mode === "run") {
      c.innerHTML = `<div id="joy"><div id="knob"></div></div><div class="pad"><div class="btns">
        <button id="b_g" class="grip">🤝 ${L().grip}</button><button id="b_pull">⬅ ${L().a_pull}</button>
        <button id="b_push">${L().a_push} ➡</button><button id="b_rock">↔ ${L().a_rock}</button>
        <button id="b_h" class="hold">🛡 ${L().hold}</button></div>
        <div class="thr" id="tr">${TKEYS.map((n, i) => `<button id="t_${n}" class="off"><small>${i + 1}</small> ${TNAME(n)}</button>`).join("")}</div>
        <button id="rel" class="rel" style="display:none">💥 ${L().release}</button></div>`;
      const pad = $("joy"), knob = $("knob");
      const upd = (ev) => { const r = pad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let dx = (ev.clientX - cx) / (r.width / 2), dy = (ev.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy);
        if (l > 1) { dx /= l; dy /= l; } joy = { x: dx, y: dy, on: l > 0.25 }; knob.style.transform = `translate(${dx * 34}px, ${dy * 34}px)`; };
      pad.addEventListener("pointerdown", (e) => { pad.setPointerCapture(e.pointerId); upd(e); });
      pad.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "touch") upd(e); });
      const end = () => { joy = { x: 0, y: 0, on: false }; knob.style.transform = ""; };
      pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);
      const on = (id, a) => $(id).addEventListener("pointerdown", (e) => { e.preventDefault(); act(a); });
      on("b_g", ["g", null]); on("b_pull", ["a", "pull"]); on("b_push", ["a", "push"]); on("b_rock", ["a", "rock"]); on("rel", ["t", null]);
      TKEYS.forEach((n) => on("t_" + n, ["a", n]));
      const hb = $("b_h");
      hb.addEventListener("pointerdown", (e) => { e.preventDefault(); hb.setPointerCapture(e.pointerId); act(["h", 1]); });
      ["pointerup", "pointercancel"].forEach((t) => hb.addEventListener(t, () => act(["h", 0])));
    } else c.innerHTML = "";
    setH();
  }
  document.addEventListener("keydown", (e) => { if (keys[e.code]) return; keys[e.code] = true; if (mode !== "run") return;
    const map = { KeyF: ["g", null], KeyJ: ["a", "pull"], KeyK: ["a", "push"], KeyL: ["a", "rock"], Enter: ["t", null], KeyT: ["t", null] };
    TKEYS.forEach((n, i) => { map["Digit" + (i + 1)] = ["a", n]; });
    if (map[e.code]) { e.preventDefault(); let a = map[e.code];
      if (a[0] === "a" && run && run.sim.p[0].wind > 0 && run.sim.p[0].act === a[1]) a = ["t", null];   // сол әдісті қайта басу — лақтыру
      act(a); }
    if (e.code === "Space") { e.preventDefault(); act(["h", 1]); } });
  document.addEventListener("keyup", (e) => { keys[e.code] = false; if (mode === "run" && e.code === "Space") act(["h", 0]); });

  function act(a) { if (run && !run.done) run.queue.push(a); }
  function keyDir() { let x = 0, y = 0;
    if (keys.KeyA || keys.ArrowLeft) x -= 1; if (keys.KeyD || keys.ArrowRight) x += 1;
    if (keys.KeyW || keys.ArrowUp) y -= 1; if (keys.KeyS || keys.ArrowDown) y += 1; return [x, y]; }

  function start() {
    const s = args.state, me = args.me;
    const sim = new K.Sim(s.stats[me], s.level, s.bout_s, s.ai_stats, s.weight);
    run = { sim, inputs: [], queue: [], lastDir: [0, 0], t0: performance.now() + 3000, done: false, ev0: 0, flash: "", flashT: 0,
      anim: null, snap: null, pause: 0, walk: [0, 0], end: null };
    window.__kRun = run; mode = "run"; controls();
  }
  const snapOf = (p, grip, walk) => ({ p: JSON.parse(JSON.stringify(p)), grip, walk: walk ? walk.slice() : [0, 0] });

  function stepRun(now) {
    const r = run, sim = r.sim, t = (now - r.t0) / 1000, tw = now / 1000;
    if (t < 0) { $("big").textContent = Math.ceil(-t); render(snapOf(sim.p, sim.grip), tw, null, null); hud(sim); return; }
    if (r.pause && now < r.pause) {
      if (r.anim) r.anim.u = (now - r.animT) / 1000 / r.anim.dur;
      render(r.snap, tw, r.anim, r.end); hud(sim); $("big").textContent = r.flash; return; }
    if (r.pause) { r.t0 += now - r.pauseFrom; r.pause = 0; r.anim = null; r.snap = null; }
    if (r.done) {
      if (!pending) { pending = true; mode = "wait"; controls();
        send("streamlit:setComponentValue", { value: { inputs: r.inputs, nonce: Date.now() + Math.random() }, dataType: "json" }); }
      render(r.snap || snapOf(sim.p, sim.grip), tw, null, r.end); hud(sim); return;
    }
    const target = Math.floor(((now - r.t0) / 1000) / K.DT);
    let guard = 0;
    while (!r.done && sim.n < target && guard < 12) {
      const n = sim.n, ev = [];
      let [dx, dy] = keyDir(); if (joy.on) { dx = joy.x; dy = joy.y; }
      let d = [0, 0]; const l = Math.hypot(dx, dy);
      if (l > 0.2) d = [Math.round(dx / l * 1000) / 1000, Math.round(dy / l * 1000) / 1000];
      if (Math.abs(d[0] - r.lastDir[0]) + Math.abs(d[1] - r.lastDir[1]) > 0.05) { ev.push([n, "d", d]); r.lastDir = d; }
      while (r.queue.length) { const q = r.queue.shift(); ev.push([n, q[0], q[1]]); }
      ev.forEach((e) => r.inputs.push(e));
      const before = snapOf(sim.p, sim.grip, r.walk), e0 = sim.events.length;
      sim.step(ev); guard++;
      sim.p.forEach((pp, i) => { const mv = Math.hypot(pp.x - before.p[i].x, pp.y - before.p[i].y) > 0.01 && !sim.grip; r.walk[i] += ((mv ? 1 : 0) - r.walk[i]) * 0.25; });
      // оқиғалар
      let stop = false;
      for (let j = e0; j < sim.events.length; j++) {
        const e = sim.events[j], kind = e[1];
        if (kind === "throw") {
          const sc = e[4], i = e[2], dd = Math.hypot(before.p[1].x - before.p[0].x, before.p[1].y - before.p[0].y) || 0.9;
          r.anim = { kind: "throw", name: e[3], sc, att: i, dd, u: 0, dur: sc >= 2 ? 1.7 : 1.1 }; r.snap = before; stop = true;
          r.flash = sc === 4 ? "🏆 " + (L().clean || "") : sc ? `${i === 0 ? "✅" : "😣"} ${TNAME(e[3])}: +${sc}` : `✖ ${TNAME(e[3])} — ${L().failed || ""}`;
        } else if (kind === "tcounter") {
          const i = e[2], dd = Math.hypot(before.p[1].x - before.p[0].x, before.p[1].y - before.p[0].y) || 0.9;
          r.anim = { kind: "counter", name: e[3], sc: 0, att: 1 - i, dd, u: 0, dur: 1.0 }; r.snap = before; stop = true;
          r.flash = `🔁 ${L().tcounter || ""} +1`;
        } else if (kind === "grip") { r.flash = "🤝 " + (L().gripOn || ""); }
        else if (kind === "warn") { r.flash = "🟨 " + (e[3] === "out" ? L().warnOut : L().warnPassive); }
        else if (kind === "pen") { r.flash = "🟨🟨 " + (L().penalty || ""); }
        else if (kind === "golden") { r.flash = "⭐ " + (L().golden || ""); }
        else if (kind === "counter") { if (e[2] === 0) r.flash = "🔁 " + (L().counter || ""); sim.p[1 - e[2]].jolt = [-0.08, 0.15]; }
        else if (BASICS.includes(kind)) { const o = sim.p[1 - e[2]]; o.jolt = kind === "pull" ? [0.12, 0.2] : kind === "push" ? [-0.15, -0.15] : [0, 0.1]; o.joltT = now; }
        if (kind === "end") {
          const w = e[2]; r.done = true;
          r.end = w >= 0 ? { w, clean: sim.clean >= 0 } : null;
          if (r.end && r.end.clean && r.anim) { const f = throwFrame(r.anim, 1), dx = before.p[1].x - before.p[0].x, dz = before.p[1].y - before.p[0].y, dl = Math.hypot(dx, dz) || 1;
            r.end.lieM = G3.mul(root(before.p[r.anim.att].x, before.p[r.anim.att].y, (r.anim.att ? -dx : dx) / dl, (r.anim.att ? -dz : dz) / dl), f.D); }
          r.endFlash = w === 0 ? "🏆 " + (L().youWin || "") : w === 1 ? "😣 " + (L().youLose || "") : "🤝 " + (L().draw || "");
        }
      }
      r.flashT = now;
      if (stop) { r.animT = now; r.pauseFrom = now; r.pause = now + r.anim.dur * 1000 + 400; break; }
      if (r.done) break;
    }
    sim.p.forEach((pp) => { if (pp.jolt && now - (pp.joltT || 0) > 300) pp.jolt = null; });
    if (r.done && !r.pause) { r.snap = snapOf(sim.p, sim.grip); r.pause = now + 2200; r.pauseFrom = now; r.flash = r.endFlash; }
    $("big").textContent = r.pause ? r.flash : (now - r.flashT < 1300 ? r.flash : "");
    render(r.anim ? r.snap : snapOf(sim.p, sim.grip, r.walk), tw, r.anim, r.anim ? null : r.end); hud(sim);
  }
  const BASICS = ["pull", "push", "rock"];

  let idle = null;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!args) return;
    if (mode === "run" && run) {
      if (run.done && run.pause && now >= run.pause && run.anim) {   // лақтыру аяқталды → жеңімпаз
        run.anim = null; run.snap = snapOf(run.sim.p, run.sim.grip); run.pause = now + 2200; run.flash = run.endFlash; }
      stepRun(now); return; }
    if (!idle) { const s = args.state, me = args.me == null ? 0 : args.me; idle = new K.Sim(s.stats[me], s.level, s.bout_s, s.ai_stats, s.weight); }
    const t = now / 1000;
    if (window.__kDemo) { const d = window.__kDemo; const q = snapOf(idle.p, d.grip); if (d.gap) { q.p[0].x = -d.gap / 2; q.p[1].x = d.gap / 2; }
      if (d.end && d.end.lie) { const f = throwFrame(d.anim0, 1); d.end.lieM = G3.mul(root(q.p[d.anim0.att].x, 0, d.anim0.att ? -1 : 1, 0), f.D); }
      render(q, d.t, d.anim || null, d.end || null); hud(idle); return; }   // сынақ үшін
    render(snapOf(idle.p, false), t, null, null); hud(idle);
  }

  function bar() {
    const a = args, s = a.state, rd = s.rides || [null, null];
    const res = (p) => rd[p] ? `${rd[p].clean === 0 ? "🏆 " : ""}${rd[p].pf} : ${rd[p].pa}` : (s.turn === p && !s.over ? "🤼 …" : "—");
    $("bar").innerHTML = s.solo
      ? `<span class="pl">🟦 ${a.names[a.me == null ? 0 : a.me]}</span><span class="res">${rd.find((x) => x) ? res(rd[0] ? 0 : 1) : "—"}</span><span class="pl">${a.ai_name || ""} 🟥</span>`
      : `<span class="pl">⚪ ${a.names[0]}</span><span class="res">${res(0)}</span><span class="res">${res(1)}</span><span class="pl">${a.names[1]} ⚫</span>`;
    $("msg").textContent = a.message || "";
  }
  function decide() {
    const s = args.state;
    if (args.clickable && !s.over && !pending) { if (mode !== "run") { mode = "ready"; run = null; } }
    else if (mode !== "run" || !args.clickable) mode = "idle";
    controls();
  }
  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const prev = args; args = d.args;
    if (!prev || prev.state.turn !== args.state.turn || (prev.state.last || {}).id !== (args.state.last || {}).id) { pending = false; if (mode === "wait") mode = "idle"; idle = null; }
    bar(); decide(); setH();
  });
  window.addEventListener("resize", () => args && setH());
  requestAnimationFrame(frame);
  send("streamlit:componentReady", { apiVersion: 1 });
  // ================= KURES UI соңы =================
})();
</script>
</body>
</html>
