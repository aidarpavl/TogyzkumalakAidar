<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { max-width: 520px; margin: 0 auto; padding: 4px 2px 8px; user-select: none; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 6px 10px; border-radius: 12px;
         margin: 4px 0; color: #fff8ec; background: linear-gradient(90deg, #3d2412, #5c3518); font-size: clamp(12px, 3.3vw, 15px); }
  .bar.active { box-shadow: 0 0 0 2px #f5b041, 0 0 16px rgba(245,176,65,.5); }
  .name { font-weight: 700; display: flex; gap: 6px; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tot { font-weight: 800; color: #f5b041; font-size: 1.15em; }
  .ends { grid-column: 1 / 3; display: flex; gap: 6px; flex-wrap: wrap; }
  .end { display: flex; gap: 2px; background: #0003; border-radius: 8px; padding: 2px 4px; }
  .chip { min-width: 20px; text-align: center; border-radius: 5px; font-size: 12px; font-weight: 700; padding: 0 3px; }
  .c10 { background: #f7d046; color: #000; } .c8 { background: #e74c3c; } .c6 { background: #3498db; } .c4 { background: #222; } .c2 { background: #eee; color: #000; } .c0 { background: #555; } .ce { background: #0002; }
  canvas { width: 100%; display: block; border-radius: 16px; touch-action: none; box-shadow: 0 8px 22px #0006; }
  .msg { text-align: center; color: #fff8ec; font-weight: 600; font-size: clamp(12px, 3.4vw, 15px); padding: 6px 10px;
         margin-top: 4px; border-radius: 10px; background: #7a4419; }
  .msg:empty { display: none; }
  .clock { font-variant-numeric: tabular-nums; background: #0004; padding: 1px 6px; border-radius: 8px; font-size: .9em; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar" id="top"></div>
  <canvas id="cv" width="600" height="720"></canvas>
  <div class="bar" id="bot"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  const W = 600, H = 720, CX = 300, CY = 300;
  const COLORS = ["#e8e8e8", "#2b2b2b"];
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let args = null, first = true, seenShot = null, anim = null, ride = null, pending = false;
  let press = null; // {x, y, touch}
  const setH = () => send("streamlit:setFrameHeight", { height: Math.ceil(document.getElementById("wrap").getBoundingClientRect().height + 8) });
  const fmt = (s) => { if (s == null) return ""; s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  // ---- серверде де дәл осындай формулалар (core/jamby.py)
  const viewHalf = (d) => 2.6 * d / 30;
  function bob(c, t) {
    const ph = 2 * Math.PI * c.freq * t + c.ph;
    return [c.ampx * Math.sin(ph / 2 + 0.3), c.ampy * (0.62 * Math.sin(ph) + 0.38 * Math.sin(2 * ph + 0.8))];
  }
  const targetX = (c, t) => c.v * (c.T / 2 - t);

  // ---- сурет салу
  let clouds = [[80, 70, 1], [330, 40, .8], [480, 110, 1.2]];
  function sky(shiftX, shiftY) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#6fb3e8"); g.addColorStop(.45, "#cfe8f7"); g.addColorStop(.46, "#c9b46a"); g.addColorStop(1, "#8a7a3a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    clouds.forEach(c => { const x = ((c[0] + shiftX * 0.1) % (W + 160) + W + 160) % (W + 160) - 80;
      ctx.beginPath(); ctx.ellipse(x, c[1] + shiftY * .2, 50 * c[2], 16 * c[2], 0, 0, 7); ctx.ellipse(x + 30 * c[2], c[1] - 8 + shiftY * .2, 30 * c[2], 14 * c[2], 0, 0, 7); ctx.fill(); });
    // таулар
    ctx.fillStyle = "#7d8fa6";
    ctx.beginPath(); ctx.moveTo(0, 330 + shiftY * .4);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 330 + shiftY * .4 - 60 * Math.abs(Math.sin((x + shiftX * .3) / 90)) - 20 * Math.sin((x + shiftX * .3) / 37));
    ctx.lineTo(W, 340); ctx.lineTo(0, 340); ctx.fill();
    ctx.fillStyle = "#e9f1f7";
    // дала
    const gg = ctx.createLinearGradient(0, 330, 0, H);
    gg.addColorStop(0, "#b9b25c"); gg.addColorStop(1, "#6f7a2c");
    ctx.fillStyle = gg; ctx.fillRect(0, 330 + shiftY * .4, W, H);
    // шөп сызықтары (жылдамдық әсері)
    ctx.strokeStyle = "rgba(60,70,20,.35)"; ctx.lineWidth = 2;
    for (let i = 0; i < 26; i++) {
      const y = 360 + (i * 37) % 360 + shiftY * .6, x = ((i * 97 + shiftX * (1.5 + (i % 3))) % (W + 60) + W + 60) % (W + 60) - 30;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 18 + (y - 330) / 10, y); ctx.stroke();
    }
  }

  function target(sx, sy, scale, hits) {
    // діңгек
    ctx.fillStyle = "#6b4423"; ctx.fillRect(sx - 6, sy, 12, 400);
    ctx.fillStyle = "#4a2e17"; ctx.fillRect(sx - 1.2 * scale, sy + 1.05 * scale, 2.4 * scale, 0.12 * scale);
    const rings = ["#f2f2f2", "#f2f2f2", "#262626", "#262626", "#2e86de", "#2e86de", "#e74c3c", "#e74c3c", "#f7d046", "#f7d046"];
    for (let i = 0; i < 10; i++) {
      const r = (1 - i * 0.1) * scale;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fillStyle = rings[i]; ctx.fill();
      ctx.strokeStyle = i < 2 ? "#999" : "rgba(255,255,255,.5)"; ctx.lineWidth = 1; ctx.stroke();
    }
    // ою-өрнек жиегі
    ctx.strokeStyle = "#b5452d"; ctx.lineWidth = Math.max(2, scale * .06);
    ctx.beginPath(); ctx.arc(sx, sy, scale * 1.02, 0, 7); ctx.stroke();
    // ортасында күміс жамбы
    const j = scale * 0.07;
    ctx.fillStyle = "#dfe6ec"; ctx.strokeStyle = "#8795a1"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(sx, sy, j * 1.5, j, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(sx, sy - j * .2, j * .7, j * .45, 0, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
    (hits || []).forEach(h => {
      const hx = sx + h[0] * scale, hy = sy - h[1] * scale;
      ctx.fillStyle = h[3] || "#000"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(hx, hy, Math.max(3, scale * .035), 0, 7); ctx.fill(); ctx.stroke();
    });
  }

  function horse(oy, ox) {
    ctx.save(); ctx.translate(W / 2 + ox, H + 30 + oy);
    // мойын
    ctx.fillStyle = "#6b3d1f";
    ctx.beginPath(); ctx.moveTo(-110, 40); ctx.quadraticCurveTo(-60, -140, -20, -190); ctx.lineTo(20, -190);
    ctx.quadraticCurveTo(60, -140, 110, 40); ctx.fill();
    // жал
    ctx.fillStyle = "#2a160a";
    ctx.beginPath(); ctx.moveTo(-14, -200); for (let i = 0; i < 9; i++) ctx.lineTo(-24 + (i % 2) * 18, -180 + i * 24); ctx.lineTo(16, 30); ctx.lineTo(10, -200); ctx.fill();
    // құлақтар
    ctx.fillStyle = "#5a321a";
    ctx.beginPath(); ctx.moveTo(-34, -186); ctx.lineTo(-24, -236); ctx.lineTo(-10, -190); ctx.fill();
    ctx.beginPath(); ctx.moveTo(34, -186); ctx.lineTo(24, -236); ctx.lineTo(10, -190); ctx.fill();
    // жүген
    ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-70, 10); ctx.quadraticCurveTo(0, -60, 70, 10); ctx.stroke();
    ctx.fillStyle = "#f5b041"; [-40, 0, 40].forEach(x => { ctx.beginPath(); ctx.arc(x, -22 + Math.abs(x) * .25, 4, 0, 7); ctx.fill(); });
    ctx.restore();
  }

  function bow(draw, oy) {
    ctx.save(); ctx.translate(70, 470 + oy);
    ctx.strokeStyle = "#5a2d0c"; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-10, -170); ctx.quadraticCurveTo(70, 0, -10, 170); ctx.stroke();
    ctx.strokeStyle = "#f5b041"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(26, -40); ctx.lineTo(26, 40); ctx.stroke();
    const pull = draw * 70;
    ctx.strokeStyle = "#eee"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, -170); ctx.lineTo(-10 - pull, 0); ctx.lineTo(-10, 170); ctx.stroke();
    if (draw > 0) { ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10 - pull, 0); ctx.lineTo(120, -40); ctx.stroke(); }
    ctx.restore();
  }

  function crosshair(x, y) {
    ctx.save(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.shadowColor = "#000"; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.moveTo(x - 26, y); ctx.lineTo(x - 8, y); ctx.moveTo(x + 8, y); ctx.lineTo(x + 26, y);
    ctx.moveTo(x, y - 26); ctx.lineTo(x, y - 8); ctx.moveTo(x, y + 8); ctx.lineTo(x, y + 26); ctx.stroke();
    ctx.fillStyle = "#e74c3c"; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill(); ctx.restore();
  }

  function hud(c, t) {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(10, 10, 210, 58); ctx.fillRect(W - 140, 10, 130, 58);
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui";
    ctx.fillText(`🎯 ${c.dist} м`, 20, 34);
    ctx.font = "15px system-ui"; ctx.fillText((args.labels || {}).end + ` ${c.end + 1}/3`, 20, 57);
    // жел
    ctx.fillText((args.labels || {}).wind, W - 130, 32);
    const wv = c.wind; ctx.strokeStyle = Math.abs(wv) > .25 ? "#e74c3c" : "#f5b041"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(W - 75, 50); ctx.lineTo(W - 75 + wv * 120, 50); ctx.stroke();
    ctx.beginPath(); const tip = W - 75 + wv * 120, dir = Math.sign(wv) || 1;
    ctx.moveTo(tip, 50); ctx.lineTo(tip - dir * 8, 44); ctx.lineTo(tip - dir * 8, 56); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    // уақыт жолағы
    if (t != null) {
      const left = Math.max(0, 1 - t / c.T);
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(10, 76, W - 20, 10);
      ctx.fillStyle = left < .25 ? "#e74c3c" : "#2ecc71"; ctx.fillRect(10, 76, (W - 20) * left, 10);
    }
    ctx.restore();
  }

  function currentHits() {
    const s = args.state, out = [];
    const perEnd = 6, n = s.shots, start = Math.floor(Math.max(0, n - 1) / perEnd) * perEnd;
    // ағымдағы серияның тигендері
    let k = 0;
    for (let i = 0; i < Math.max(s.hits[0].length, s.hits[1].length); i++) {
      for (let p = 0; p < 2; p++) {
        if (i < s.hits[p].length) { if (k >= start) out.push(s.hits[p][i].concat([p === 0 ? "#fff" : "#111"])); k++; }
      }
    }
    return out;
  }

  // ---- негізгі цикл
  function frame(now) {
    requestAnimationFrame(frame);
    if (!args) return;
    const s = args.state, c = s.cur;
    if (anim) { drawAnim(now); return; }
    if (ride && c && ride.id === c.id) {
      const t = (now - ride.t0) / 1000;
      const [bx, by] = bob(c, t), half = viewHalf(c.dist), sc = W / 2 / half;
      const shX = -bx * sc, shY = by * sc; // камера тербелісі (амортизация)
      sky(-t * 90 + shX, shY);
      target(CX + (targetX(c, t) - bx) * sc, CY + by * sc, sc, currentHits());
      horse(by * sc * 0.55 + Math.abs(Math.sin(2 * Math.PI * c.freq * t + c.ph)) * 10, -bx * sc * .3);
      bow(press ? 1 : 0, by * sc * 0.3);
      if (press) crosshair(press.cx, press.cy);
      else { ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = "bold 20px system-ui"; ctx.textAlign = "center"; ctx.fillText(args.hint || "", W / 2, H - 30); ctx.textAlign = "left"; }
      hud(c, t);
      if (t >= c.T && !pending) fire(t, true);
      return;
    }
    drawIdle();
  }

  function drawIdle() {
    const s = args.state, c = s.cur || (s.last ? { dist: s.last.dist, end: 2, wind: 0, T: 1 } : { dist: 30, end: 0, wind: 0, T: 1 });
    const sc = W / 2 / viewHalf(c.dist);
    const t = performance.now() / 1000;
    const idleBob = Math.sin(t * 2) * 4;
    sky(0, idleBob);
    target(CX, CY + idleBob, sc, currentHits());
    horse(idleBob * 1.5, 0);
    bow(0, idleBob);
    if (s.cur) hud(s.cur, null);
  }

  function startAnim(last) {
    anim = { last, t0: performance.now() };
  }
  function drawAnim(now) {
    const a = anim, L = a.last, dt = (now - a.t0) / 1000;
    const sc = W / 2 / viewHalf(L.dist);
    sky(0, 0);
    target(CX, CY, sc, currentHits().slice(0, -1));
    horse(0, 0); bow(0, 0);
    const fly = Math.min(1, dt / 0.55);
    const ex = CX + L.rx * sc, ey = CY - L.ry * sc;
    const x = W / 2 + (ex - W / 2) * fly, y = H - 60 + (ey - H + 60) * fly - Math.sin(fly * Math.PI) * 60;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2 + (ex - W / 2) / 900);
    const len = 90 * (1 - fly * .75);
    ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 4 * (1 - fly * .6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-len, 0); ctx.stroke();
    ctx.fillStyle = COLORS[L.shooter] === "#e8e8e8" ? "#c0392b" : "#2980b9";
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(-len - 12, -6); ctx.lineTo(-len - 6, 0); ctx.lineTo(-len - 12, 6); ctx.fill();
    ctx.restore();
    if (fly >= 1) {
      ctx.save(); ctx.font = "bold 54px system-ui"; ctx.textAlign = "center";
      ctx.fillStyle = L.pts >= 9 ? "#f7d046" : L.pts ? "#fff" : "#e74c3c"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
      const txt = L.timeout ? "⏱ 0" : L.x ? "X · 10" : L.pts ? "+" + L.pts : (args.labels || {}).miss;
      ctx.strokeText(txt, W / 2, 150); ctx.fillText(txt, W / 2, 150); ctx.restore();
    }
    if (dt > 1.6) { anim = null; maybeRide(); }
  }

  function maybeRide() {
    const s = args.state;
    if (args.clickable && s.cur && !s.over && !anim && (!ride || ride.id !== s.cur.id)) {
      ride = { id: s.cur.id, t0: performance.now() };
    }
  }

  function fire(t, auto) {
    const c = args.state.cur;
    if (!c || pending) return;
    pending = true;
    let ax = 0, ay = 0, tt = t;
    if (press) {
      const half = viewHalf(c.dist), sc = W / 2 / half;
      ax = (press.cx - CX) / sc; ay = -(press.cy - CY) / sc;
    } else if (auto) { tt = c.T + 1; }
    press = null;
    send("streamlit:setComponentValue", { value: { ax, ay, t: tt, nonce: Date.now() + Math.random() }, dataType: "json" });
  }

  function toCanvas(ev) {
    const r = cv.getBoundingClientRect();
    return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height];
  }
  function setPress(ev) {
    const [x, y] = toCanvas(ev), off = ev.pointerType === "mouse" ? 0 : 90;
    press = { cx: x, cy: Math.max(20, y - off) };
  }
  cv.addEventListener("pointerdown", (ev) => {
    if (!args || !args.clickable || pending || !ride) return;
    cv.setPointerCapture(ev.pointerId); setPress(ev);
  });
  cv.addEventListener("pointermove", (ev) => { if (press) setPress(ev); });
  cv.addEventListener("pointerup", () => {
    if (!press || !ride || pending) { press = null; return; }
    fire((performance.now() - ride.t0) / 1000, false);
  });
  cv.addEventListener("pointercancel", () => { press = null; });

  function bars() {
    const a = args, s = a.state, me = a.bottom, top = 1 - me, bot = me;
    const clk = (p) => a.clocks ? `<span class="clock">⏱ ${fmt(a.clocks[p])}</span>` : "";
    const chip = (v) => v == null ? '<span class="chip ce">·</span>' : `<span class="chip c${v >= 9 ? 10 : v >= 7 ? 8 : v >= 5 ? 6 : v >= 3 ? 4 : v >= 1 ? 2 : 0}">${v === 0 ? "M" : v}</span>`;
    const row = (p) => {
      const sc = s.scores[p]; let ends = "";
      for (let e = 0; e < 3; e++) { let h = ""; for (let i = 0; i < 3; i++) h += chip(sc[e * 3 + i]); ends += `<span class="end">${h}</span>`; }
      return `<span class="name">${p === 0 ? "⚪" : "⚫"} ${a.names[p]} ${clk(p)}</span><span class="tot">🏹 ${sc.reduce((x, y) => x + y, 0)}</span><div class="ends">${ends}</div>`;
    };
    const t = document.getElementById("top"), b = document.getElementById("bot");
    t.innerHTML = row(top); b.innerHTML = row(bot);
    t.classList.toggle("active", s.turn === top && !s.over); b.classList.toggle("active", s.turn === bot && !s.over);
    document.getElementById("msg").textContent = a.message || "";
  }

  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const prev = args;
    args = d.args;
    if (!prev || prev.token !== args.token || JSON.stringify(prev.state.scores) !== JSON.stringify(args.state.scores)) pending = false;
    bars();
    const last = args.state.last, key = last ? (args.room || "") + ":" + last.id : null;
    if (!first && last && key !== seenShot) { seenShot = key; ride = null; startAnim(last); }
    else seenShot = key;
    first = false;
    if (!args.clickable) ride = null;
    maybeRide();
    setH();
  });
  window.addEventListener("resize", () => args && setH());
  requestAnimationFrame(frame);
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
