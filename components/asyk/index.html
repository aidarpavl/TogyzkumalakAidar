<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { max-width: 480px; margin: 0 auto; padding: 4px 2px 8px; user-select: none; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 12px;
         margin: 4px 0; color: #fff8ec; background: linear-gradient(90deg, #3d2412, #5c3518); font-size: clamp(12px, 3.4vw, 16px); }
  .bar.active { box-shadow: 0 0 0 2px #f5b041, 0 0 16px rgba(245,176,65,.5); }
  .name { font-weight: 700; display: flex; gap: 6px; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sq { width: 14px; height: 14px; border-radius: 4px; }
  .got { font-weight: 800; color: #f5b041; }
  canvas { width: 100%; display: block; border-radius: 16px; touch-action: none; box-shadow: 0 8px 22px #0006; }
  .msg { text-align: center; color: #fff8ec; font-weight: 600; font-size: clamp(12px, 3.4vw, 15px); padding: 6px 10px;
         margin-top: 4px; border-radius: 10px; background: #7a4419; }
  .msg:empty { display: none; }
  .clock { font-variant-numeric: tabular-nums; background: #0004; padding: 2px 8px; border-radius: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar" id="top"></div>
  <canvas id="cv" width="600" height="800"></canvas>
  <div class="bar" id="bot"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  const W = 600, H = 800, CX = 300, CY = 300, R = 190, BASE = 700, SXMIN = 80, SXMAX = 520, AR = 11, SR = 14;
  const COLORS = ["#d63031", "#0984e3"];
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let args = null, seenShot = null, first = true, anim = null, sx = 300, aim = null, dragMode = null, pending = false;

  const setH = () => send("streamlit:setFrameHeight", { height: Math.ceil(document.getElementById("wrap").getBoundingClientRect().height + 8) });
  const fmt = (s) => { if (s == null) return ""; s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function ground() {
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 60, W / 2, H / 2, H * 0.75);
    g.addColorStop(0, "#d9b98a"); g.addColorStop(1, "#a97c4f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // текстура
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    ctx.fillStyle = "rgba(90,60,30,.12)";
    for (let i = 0; i < 380; i++) { ctx.beginPath(); ctx.arc(rnd() * W, rnd() * H, rnd() * 2.2 + .4, 0, 7); ctx.fill(); }
    // кон шеңбері
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 4; ctx.setLineDash([14, 9]);
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CX - R + 25, CY); ctx.lineTo(CX + R - 25, CY); ctx.stroke();
    // ату сызығы
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(SXMIN - 30, BASE + 22); ctx.lineTo(SXMAX + 30, BASE + 22); ctx.stroke(); ctx.restore();
    // ою-өрнек бұрыштары
    ctx.fillStyle = "rgba(122,68,25,.35)";
    [[0, 0], [W, 0], [0, H], [W, H]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 60, 0, 7); ctx.fill(); });
  }

  function asyk(x, y, rot, alpha) {
    ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.translate(x, y); ctx.rotate(rot);
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
    const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, AR * 1.3);
    g.addColorStop(0, "#fffaf0"); g.addColorStop(.6, "#eadcbf"); g.addColorStop(1, "#c7ad80");
    ctx.fillStyle = g; ctx.beginPath();
    ctx.ellipse(0, 0, AR * 1.2, AR * 0.88, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.strokeStyle = "rgba(120,90,50,.55)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-AR * 0.55, -AR * 0.2); ctx.quadraticCurveTo(0, AR * 0.35, AR * 0.55, -AR * 0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-AR * 0.62, 0, AR * 0.22, 0, 7); ctx.arc(AR * 0.62, 0, AR * 0.22, 0, 7); ctx.stroke();
    ctx.restore();
  }

  function saqa(x, y, color, glow) {
    ctx.save(); ctx.translate(x, y);
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 18; }
    const g = ctx.createRadialGradient(-4, -4, 1, 0, 0, SR * 1.3);
    g.addColorStop(0, "#fff"); g.addColorStop(.25, color); g.addColorStop(1, "#000");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, SR * 1.2, SR * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "#f5b041"; ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, 7); ctx.fill();
    ctx.restore();
  }

  const rotOf = (i) => ((i * 2.399963) % Math.PI) - Math.PI / 2;

  function drawStatic() {
    ground();
    const s = args.state;
    s.asyks.forEach((p, i) => asyk(p[0], p[1], rotOf(i)));
    if (args.clickable && !pending && !anim) {
      const col = COLORS[s.turn];
      if (aim) {
        const len = Math.min(1, Math.hypot(aim.dx, aim.dy) / 220);
        const ux = -aim.dx / (Math.hypot(aim.dx, aim.dy) || 1), uy = -aim.dy / (Math.hypot(aim.dx, aim.dy) || 1);
        ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
        ctx.beginPath(); ctx.moveTo(sx, BASE); ctx.lineTo(sx + ux * (120 + 380 * len), BASE + uy * (120 + 380 * len)); ctx.stroke();
        ctx.setLineDash([]); ctx.strokeStyle = col; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(sx, BASE); ctx.lineTo(sx + aim.dx * 0.6, BASE + aim.dy * 0.6); ctx.stroke();
        // күш шкаласы
        ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(20, H - 40, W - 40, 16);
        const pg = ctx.createLinearGradient(20, 0, W - 20, 0);
        pg.addColorStop(0, "#2ecc71"); pg.addColorStop(.6, "#f1c40f"); pg.addColorStop(1, "#e74c3c");
        ctx.fillStyle = pg; ctx.fillRect(20, H - 40, (W - 40) * len, 16); ctx.restore();
      } else {
        ctx.save(); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "bold 20px system-ui"; ctx.textAlign = "center";
        ctx.fillText(args.hint || "", W / 2, H - 22); ctx.restore();
      }
      saqa(sx, BASE, col, true);
    }
  }

  function playAnim(last) {
    const frames = last.frames, col = COLORS[last.shooter];
    let i = 0;
    anim = true;
    function step() {
      if (i >= frames.length) { anim = null; drawStatic(); setH(); return; }
      ground();
      const f = frames[i];
      for (let k = 1; k < f.length; k++) {
        const out = Math.hypot(f[k][0] - CX, f[k][1] - CY) > R;
        asyk(f[k][0], f[k][1], rotOf(k - 1), out && i === frames.length - 1 ? 0.5 : 1);
      }
      saqa(f[0][0], f[0][1], col, false);
      i += 1;
      requestAnimationFrame(step);
    }
    step();
  }

  function bars() {
    const a = args, s = a.state, me = a.bottom;
    const top = 1 - me, bot = me;
    const clk = (p) => a.clocks ? `<span class="clock">⏱ ${fmt(a.clocks[p])}</span>` : "";
    const row = (p) => `<span class="name"><span class="sq" style="background:${COLORS[p]}"></span>${a.names[p]}</span>${clk(p)}<span class="got">🦴 ${s.captured[p]}</span>`;
    const t = document.getElementById("top"), b = document.getElementById("bot");
    t.innerHTML = row(top); b.innerHTML = row(bot);
    t.classList.toggle("active", s.turn === top && !s.over); b.classList.toggle("active", s.turn === bot && !s.over);
    document.getElementById("msg").textContent = a.message || "";
  }

  function toField(ev) {
    const r = cv.getBoundingClientRect();
    return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height];
  }
  cv.addEventListener("pointerdown", (ev) => {
    if (!args || !args.clickable || pending || anim) return;
    const [x, y] = toField(ev);
    cv.setPointerCapture(ev.pointerId);
    if (Math.hypot(x - sx, y - BASE) < 55) { dragMode = "aim"; aim = { dx: 0, dy: 0 }; }
    else if (y > BASE - 90) { dragMode = "move"; sx = Math.max(SXMIN, Math.min(SXMAX, x)); }
    drawStatic();
  });
  cv.addEventListener("pointermove", (ev) => {
    if (!dragMode) return;
    const [x, y] = toField(ev);
    if (dragMode === "aim") aim = { dx: x - sx, dy: y - BASE };
    else sx = Math.max(SXMIN, Math.min(SXMAX, x));
    drawStatic();
  });
  const release = () => {
    if (dragMode === "aim" && aim) {
      const len = Math.min(1, Math.hypot(aim.dx, aim.dy) / 220);
      if (len > 0.08 && -aim.dy < 0) {
        pending = true;
        send("streamlit:setComponentValue", { value: { sx: Math.round(sx), dx: -aim.dx, dy: -aim.dy, power: Math.round(len * 1000) / 1000, nonce: Date.now() + Math.random() }, dataType: "json" });
      }
    }
    dragMode = null; aim = null; drawStatic();
  };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);

  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const prev = args;
    args = d.args;
    if (!prev || JSON.stringify(prev.state.asyks) !== JSON.stringify(args.state.asyks) || prev.token !== args.token) pending = false;
    bars();
    const last = args.state.last;
    const key = last ? (args.room || "") + ":" + last.id : null;
    if (!first && last && key !== seenShot && args.animate !== false) { seenShot = key; playAnim(last); }
    else { seenShot = key; if (!anim) drawStatic(); }
    first = false;
    setH();
  });
  window.addEventListener("resize", () => args && setH());
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
